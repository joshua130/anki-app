<title>消費税法 理論暗記</title>
<style>
:root{color-scheme:light;--bg:#f4f3ef;--card:#fff;--ink:#1f2328;--sub:#646b73;--line:#e2e0da;--brand:#256e4e;--brands:#e2efe8;
 --g:47,143,91;--r:200,71,58;--warn:#a26b00;--miss:#ffd6cf;--extra:#dcdcdc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;font-size:15px;line-height:1.7;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:16px;margin:0}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav button{border:none;background:none;color:var(--sub);padding:8px 12px;border-radius:8px;font:inherit;cursor:pointer;min-height:40px}
nav button.on{background:var(--brands);color:var(--brand);font-weight:700}

#sync{font-size:12px;color:var(--sub);cursor:pointer;padding:6px 8px;border-radius:6px}
#sync.err{color:rgb(var(--r))}
main{max-width:1100px;margin:0 auto;padding:16px 16px 100px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
h2{font-size:17px;margin:0 0 10px}h3{font-size:15px;margin:0 0 6px}
.sub{color:var(--sub);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button.b,label.b{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:9px;cursor:pointer;min-height:40px;display:inline-flex;align-items:center;gap:6px}
button.b:hover{border-color:var(--brand)}
button.p{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
button.s{padding:4px 10px;font-size:13px;min-height:34px}
button.danger{color:rgb(var(--r))}
button:disabled{opacity:.4;cursor:default}
input[type=text],input[type=password],input[type=number],select,textarea{font:inherit;font-size:15px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=text],input[type=password]{width:100%}
textarea{width:100%;min-height:160px;font-size:17px;line-height:1.85;padding:12px;resize:vertical}
textarea:focus,input:focus{outline:2px solid var(--brand);border-color:transparent}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}

td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.star{color:var(--warn);letter-spacing:-2px;white-space:nowrap}
.ok{color:rgb(var(--g));font-weight:700}.ng{color:rgb(var(--r));font-weight:700}
.pill{display:inline-block;padding:0 9px;border-radius:99px;font-size:12px;background:var(--brands);color:var(--brand);white-space:nowrap}
.pill.ng{background:#f8e2de;color:rgb(var(--r))}.pill.w{background:#fbefd5;color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--bg);border-radius:9px;padding:10px 12px}.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
/* map */
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--sub)}
.legend i{display:inline-block;width:16px;height:16px;border-radius:4px;border:1px solid var(--line);vertical-align:-3px;margin-right:4px}
.fade{display:inline-flex;gap:2px;vertical-align:-3px;margin-right:4px}.fade i{margin:0;width:12px}
.ch{margin:18px 0 8px;font-weight:700;font-size:14px;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.grid.sec{grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}
.tile{position:relative;border:1px solid var(--line);border-radius:10px;padding:8px 10px 10px;min-height:86px;cursor:pointer;background:#fff;display:flex;flex-direction:column;gap:4px;transition:transform .08s;user-select:none}
.tile:active{transform:scale(.97)}
.tile .no{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.tile .tt{font-size:12px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .meta{font-size:11px;margin-top:auto;opacity:.85}
.tile.dark{color:#fff;border-color:transparent}.tile.dark .star{color:#ffe08a}
.tile .segs{display:flex;gap:2px}.tile .segs span{flex:1;height:7px;border-radius:2px;border:1px solid rgba(0,0,0,.12);background:#fff}
.slow{display:inline-block;font-size:10px;font-weight:700;line-height:15px;padding:0 4px;border-radius:4px;background:#fbefd5;color:#8a5a00;vertical-align:1px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px}
.timer.over{color:var(--warn)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--brand)}
.day{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.day.today{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
.kind{display:inline-block;font-size:11px;padding:0 6px;border-radius:4px;margin-right:4px;white-space:nowrap}
.k-new{background:#e6eefb;color:#2a5aa8}.k-review{background:var(--brands);color:var(--brand)}.k-fix{background:#f8e2de;color:rgb(var(--r))}.k-speed{background:#fbefd5;color:#8a5a00}
.tile .dot{position:absolute;top:7px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 2px #fff}
.qhead{grid-column:1/-1;font-size:13px;font-weight:700;margin-top:6px}
/* sheet */
#sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.35);display:none;align-items:flex-end;justify-content:center}
#sheet.on{display:flex}
#sheet .in{background:var(--card);width:min(760px,100%);max-height:86vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:800px){#sheet{align-items:center}#sheet .in{border-radius:16px}}
.sw{display:inline-block;width:22px;height:22px;border-radius:5px;border:1px solid var(--line);vertical-align:middle}
/* practice */
.prompt{font-weight:700;font-size:17px;margin:6px 0}
.prog{display:flex;gap:4px;margin:8px 0 10px;flex-wrap:wrap}.prog span{width:28px;height:6px;border-radius:3px;background:var(--line)}
.prog span.cur{background:var(--sub)}.prog span.ok{background:rgb(var(--g))}.prog span.ng{background:rgb(var(--r))}
.diff{white-space:pre-wrap;word-break:break-all;background:var(--bg);border-radius:9px;padding:12px;font-size:16px;line-height:1.95}
.diff .m{background:var(--miss);border-radius:2px}.diff .x{background:var(--extra);text-decoration:line-through;color:var(--sub);border-radius:2px}
.answer{white-space:pre-wrap;background:var(--bg);border-radius:9px;padding:12px}
.big{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.hint{color:var(--warn)}
.ai{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:12px;background:#fbfbf9}
.ai h4{margin:0 0 6px;font-size:14px}
.ai ul{margin:4px 0 4px 18px;padding:0}.ai li{margin:4px 0}
.kinki{border-left:4px solid rgb(var(--r));background:#fdf1ef;padding:6px 10px;border-radius:4px;margin:6px 0}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
kbd{font-size:11px;border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.7;font-family:inherit}
.empty{color:var(--sub);text-align:center;padding:22px}
details summary{cursor:pointer;color:var(--sub);font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}.seg button{border:none;background:#fff;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer}.seg button.on{background:var(--brand);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:10px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:.95}
.field{margin:10px 0}.field label{display:block;font-size:13px;color:var(--sub);margin-bottom:3px}
@media (max-width:640px){.hide-sm{display:none}.grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}}
/* 圧迫暗記 */
.ez{display:inline-block;font-size:10px;font-weight:700;line-height:15px;padding:0 4px;border-radius:4px;vertical-align:1px}
.ez-e{background:var(--brands);color:var(--brand)}.ez-m{background:#ecebe6;color:#555}.ez-h{background:#f8e2de;color:rgb(var(--r))}
.cd{font-size:44px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}.cd.low{color:rgb(var(--r))}
.studytext{white-space:pre-wrap;word-break:break-all;font-size:18px;line-height:2;background:#fffdf5;border:1px solid var(--line);border-radius:10px;padding:14px;-webkit-user-select:none;user-select:none}
.bar.cdb i{transition:width .25s linear}
/* 間違いの記録 */
.e1{background:#fde4e0;border-radius:2px}.e2{background:#f8bfb5;border-radius:2px}.e3{background:#ef9384;border-radius:2px}.eg{background:#fbefd5;border-radius:2px}
mark{background:#f8bfb5;color:inherit;border-radius:2px;padding:0 1px}
.diff.inl{display:inline;padding:1px 5px;font-size:15px;line-height:1.9}
.dots{display:inline-flex;gap:2px;vertical-align:middle;margin-left:4px}.dots i{width:8px;height:8px;border-radius:50%;background:rgb(var(--g))}.dots i.x{background:rgb(var(--r))}
.erow{border-bottom:1px solid var(--line);padding:10px 0}.erow:last-child{border-bottom:none}
.ecor,.evar{font-size:15px;line-height:1.9;word-break:break-all;margin-top:2px}
.erep{font-size:14px;margin:4px 0 0;padding:6px 10px;background:#fdf1ef;border-radius:6px;word-break:break-all}
.recur li{margin:6px 0;word-break:break-all}
/* 読む */
.rsec{scroll-margin-top:80px}
.rblk{margin:12px 0 4px}
.rblk .rh{font-weight:700;font-size:16px}
.rtext{word-break:break-all;font-size:17px;line-height:2;padding:2px 0;border-radius:6px}
.rtext.hid{color:transparent;background:#ecebe6;cursor:pointer;-webkit-user-select:none;user-select:none}
.rtext.hid::after{content:'タップで表示';color:var(--sub);font-size:12px}
.note{border:1px solid var(--line);border-left:4px solid var(--brand);background:#fbfcfa;border-radius:8px;padding:8px 12px;margin-top:12px}
.note summary{font-weight:700;color:var(--brand);font-size:14px;padding:4px 0}
.note h4{margin:14px 0 4px;font-size:14px;line-height:1.6}
.note p{margin:3px 0;font-size:15px;line-height:1.9;text-indent:1em}
.note p.ni{text-indent:0}
.note .lab{display:inline-block;font-size:12px;font-weight:700;color:var(--brand);border:1px solid var(--brand);border-radius:4px;padding:0 6px;margin:10px 0 2px}
.note img{display:block;max-width:100%;height:auto;margin:6px 0;background:#fff}
.susp{border-color:var(--warn);background:#fffaf0}

</style>

<body>
<header><h1>消費税法 理論暗記</h1><nav id="nav"></nav><span class="grow"></span><span id="sync" onclick="syncNow(true)"></span></header>
<main id="main"></main>
<div id="sheet" onclick="if(event.target===this)closeSheet()"><div class="in" id="sheetIn"></div></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
/* =========================================================
   保存領域
   - anki2-data   : 理論データ（PDFから抽出したもの。公開サーバーには置かない）
   - anki2-state  : 記録（同期対象）
   - anki2-config : APIキー・トークンなど端末ローカルの設定（同期しない）
   ========================================================= */
const K_DATA='anki2-data',K_STATE='anki2-state',K_CONF='anki2-config',K_SUSP='anki2-susp';
/* - anki2-susp   : 中断中の練習・圧迫暗記（端末ローカル。続きから再開するため）
   - IndexedDB anki2/kv 'notes' : 解説データ（要旨・内容解説。図を含み大きいため localStorage ではなく IndexedDB） */
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast('保存に失敗しました: '+e.message);return false}};
const now=()=>Date.now();
const uid=()=>now().toString(36)+Math.random().toString(36).slice(2,8);

const DEFAULT_KINKI=[
 '「及び」「並びに」「又は」「若しくは」を取り違えない',
 '「以上」「超」「以下」「未満」を取り違えない',
 '期間の起算点・終期（「日」「前日」「前々日」「翌日」、「経過する日」「経過した日」）を取り違えない',
 '「しなければならない」「することができる」「するものとする」を取り違えない',
 '「とみなす」と「とする」を取り違えない',
 '主体（事業者・課税事業者・免税事業者・税務署長 等）を取り違えない',
 '除外の括弧書き（「〜を除く。」）を落として適用範囲を変えない',
 '数値・割合・金額（１千万円、５億円、95％、２年 等）を誤らない',
 '助詞（てにをは）の誤りで主語・目的語・要件と効果の関係を変えない'
];
function initState(){const t=now(),k={};DEFAULT_KINKI.forEach(x=>{const id=uid();k[id]={scope:'g',text:x,u:t}});
  return {v:2,attempts:{},pressure:{},deleted:{},plan:{},overrides:{},kinki:k,settings:{threshold:90,ignorePunct:false,ignoreMarks:true,showHead:true,u:0}}}
let DATA=ld(K_DATA,null);
let S=ld(K_STATE,null)||initState();
const DEF_SET={threshold:90,ignorePunct:false,ignoreMarks:true,showHead:true,memHead:true,targetSpeed:40,examDate:'',minWeekday:60,minWeekend:120,horizon:14,learnRate:12};
S.settings=Object.assign({},DEF_SET,S.settings);S.schedule=S.schedule||null;S.pressure=S.pressure||{};
let C=Object.assign({model:'claude-sonnet-5-5',aiOn:true,apiKey:'',ghOwner:'',ghRepo:'',ghToken:'',device:'',view:'q',pressAI:false,pSort:'hard'},ld(K_CONF,{}));
let ITEMS=[],BYID={},QS=[],ATT={},MCACHE={};
let SUSP=ld(K_SUSP,{});
/* ---------- IndexedDB（解説データ用） ---------- */
const IDB={p:null,open(){return this.p||(this.p=new Promise((res,rej)=>{const r=indexedDB.open('anki2',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},
  async get(k){const db=await this.open();return new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
  async set(k,v){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}};
let NOTES=null,notesLoaded=false;
async function setNotes(n){NOTES=n;await IDB.set('notes',n)}
function setData(d){DATA=d;ITEMS=d?d.items:[];BYID=Object.fromEntries(ITEMS.map(i=>[i.id,i]));
  const seen={};QS=[];ITEMS.forEach(i=>{if(!seen[i.q]){seen[i.q]={q:i.q,qt:i.qt,ch:i.ch,items:[]};QS.push(seen[i.q])}seen[i.q].items.push(i)})}
setData(DATA);
function reindex(){ATT={};MCACHE={};for(const a of Object.values(S.attempts)){if(S.deleted[a.uid])continue;(ATT[a.id]=ATT[a.id]||[]).push(a)}
  for(const k in ATT)ATT[k].sort((x,y)=>x.ts-y.ts);reindexP()}
/* 圧迫暗記の記録（通常の練習記録とは別） */
let PRA={},EZ_CUT=null;
function reindexP(){PRA={};EZ_CUT=null;for(const a of Object.values(S.pressure||{})){if(S.deleted[a.uid])continue;(PRA[a.id]=PRA[a.id]||[]).push(a)}
  for(const k in PRA)PRA[k].sort((x,y)=>x.ts-y.ts)}
reindex();
let dirty=false;
function saveState(){sv(K_STATE,S);dirty=true;reindex();scheduleSync()}
function saveConf(){sv(K_CONF,C)}

/* ---------- 日付ユーティリティ ---------- */
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const TODAY=()=>ymd(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d)};
const daysBetween=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stars=n=>n?'<span class="star">'+'★'.repeat(n)+'</span>':'';
const pct=v=>v==null?'–':Math.round(v)+'%';
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2600)}

/* ---------- 理論ごとの状態 ---------- */
function blocksOf(id){return (S.overrides[id]&&S.overrides[id].blocks)||BYID[id].blocks}
function attemptsOf(id){return ATT[id]||[]}
function lastOf(id){const a=attemptsOf(id);return a.length?a[a.length-1]:null}
/* ---------- 速度（字/分）と復習間隔 ----------
   速度 = 正しく書けた文字数 ÷ 実際に考えて書いていた時間（分）
   合格でも遅い（目標速度の75%未満）場合は「まだ思い出すのに苦労している」とみなし、間隔を伸ばさない */
const STEPS=[1,3,7,14,30,60];
function speedOf(a){if(!a||!a.sec)return null;const n=(a.blocks||[]).reduce((s,b)=>s+(b.m!=null?b.m:(b.n||0)*(b.acc||0)/100),0);return n?n/(a.sec/60):null}
function speedClass(a){const v=speedOf(a),t=S.settings.targetSpeed;if(v==null)return 'na';if(v<t*.75)return 'slow';if(v<t)return 'mid';return 'fast'}
function quality(a){if(!a.pass)return 'fail';const c=speedClass(a);if(c==='slow')return 'slow';if(c==='fast'&&a.acc>=97)return 'great';return 'good'}
function srsOf(id){const A=attemptsOf(id);if(!A.length)return null;let i=-1;
  for(const a of A){const q=quality(a);i=q==='fail'?0:q==='slow'?Math.max(i,0):Math.min(i+(q==='great'?2:1),STEPS.length-1)}
  return {iv:STEPS[i],due:addDays(A[A.length-1].date,STEPS[i]),q:quality(A[A.length-1])}}
const fmtSec=s=>{s=Math.round(s||0);return s>=3600?`${Math.floor(s/3600)}時間${Math.round(s%3600/60)}分`:`${Math.floor(s/60)}:${pad(s%60)}`};
const fmtMin=m=>m>0&&m<1?"1分未満":m>=60?`${Math.floor(m/60)}時間${Math.round(m%60)}分`:`${Math.round(m)}分`;
/* 見出し（⑴ 課税の対象）：「見出しも覚える」がオンなら、問いには番号（（1））だけを出し、見出しの文言も解答に含める */
function headParts(h){if(!h)return null;const m=h.match(/^([⑴-⒇])[\s　]*(.*)$/);return m?{no:m[1],label:m[2].trim()}:{no:'',label:h.trim()}}
const memHead=()=>S.settings.memHead!==false;
function tgt(b){const p=headParts(b.h);return memHead()&&p&&p.label?p.label+'\n'+b.t:b.t}
function headHTML(b){if(!b.h)return '（本文）';if(!memHead())return esc(b.h);const p=headParts(b.h);
  return p.no?'（'+(p.no.charCodeAt(0)-0x2473)+'）':(p.label?'（見出し）':'')}
function headLabel(b){const p=headParts(b.h);return memHead()&&p&&p.label?p.label:''}
function charsOf(id){return blocksOf(id).reduce((s,b)=>s+norm(tgt(b)).length,0)}
function mySpeed(){const v=Object.values(ATT).flat().map(speedOf).filter(x=>x);if(v.length<3)return S.settings.targetSpeed;v.sort((a,b)=>a-b);return v[Math.floor(v.length/2)]}
/* 1回の練習（思い出して書く）にかかる見込み時間（分） */
function estPractice(id){const A=attemptsOf(id).filter(a=>a.sec).slice(-3);
  if(A.length){const s=A.map(a=>a.sec).sort((a,b)=>a-b)[Math.floor(A.length/2)];return Math.max(1,s/60)}
  return Math.max(1,charsOf(id)/mySpeed())}
/* 新規に覚える場合の見込み時間（読み込み＋練習） */
function estNew(id){return Math.max(3,charsOf(id)/S.settings.learnRate)+estPractice(id)}
function estFor(id){return attemptsOf(id).length?estPractice(id):estNew(id)}
function planOf(d=TODAY()){return (S.plan[d]&&S.plan[d].ids)||[]}
function setPlan(ids,d=TODAY()){S.plan[d]={ids:[...new Set(ids)],u:now()};saveState()}
function bestOn(id,d){let b=null;for(const a of attemptsOf(id))if(a.date===d&&(!b||a.acc>b.acc))b=a;return b}
function dueList(){const t=TODAY();return ITEMS.filter(i=>{const s=srsOf(i.id);return s&&s.due<=t}).map(i=>i.id)}
function kinkiFor(id){return Object.entries(S.kinki).filter(([k,v])=>!v.del&&(v.scope==='g'||v.scope===id)).map(([k,v])=>({k,...v}))}

/* ---------- 色（精度）と濃度（経過日数） ---------- */
const FADE=[[0,1],[1,.82],[3,.64],[7,.46],[14,.32],[30,.2],[1e9,.12]];
function alphaOf(days){for(const [d,a] of FADE)if(days<=d)return a;return .12}
function toneStyle(st){ // st: null | {pass,days}
  if(!st)return {style:'',dark:false};
  const a=alphaOf(st.days),c=st.pass?'var(--g)':'var(--r)';
  return {style:`background:rgba(${c},${a});border-color:rgba(${c},${Math.min(1,a+.15)})`,dark:a>=.6};
}

function itemStatus(id){const l=lastOf(id);if(!l)return null;return {pass:l.pass,acc:l.acc,days:daysBetween(l.date,TODAY()),date:l.date}}
function qStatus(q){const st=q.items.map(i=>itemStatus(i.id)).filter(Boolean);if(!st.length)return null;
  return {pass:st.every(s=>s.pass),acc:st.reduce((s,x)=>s+x.acc,0)/st.length,days:Math.max(...st.map(s=>s.days)),done:st.length,total:q.items.length}}

/* =========================================================
   採点（文字比較）
   ========================================================= */
const MARK_RE=/^[\s　]*(?:[⑴-⒇]|[①-⑳]|[イロハニホヘトチリヌ](?=[\s　])|（注[0-9０-９\s]*）|※[0-9０-９]*)[\s　]*/gm;
function norm(s){if(S.settings.ignoreMarks)s=s.replace(MARK_RE,'');s=s.normalize('NFKC').replace(/\s+/g,'');
  if(S.settings.ignorePunct)s=s.replace(/[、。,.，．・「」『』]/g,'');return s}
function diff(target,input){
  const a=[...target],b=[...input],n=a.length,m=b.length,W=m+1,dp=new Uint16Array((n+1)*(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i*W+j]=a[i]===b[j]?dp[(i+1)*W+j+1]+1:Math.max(dp[(i+1)*W+j],dp[i*W+j+1]);
  const ops=[];let i=0,j=0;
  while(i<n||j<m){if(i<n&&j<m&&a[i]===b[j]){ops.push(['=',a[i]]);i++;j++}
    else if(j<m&&(i>=n||dp[i*W+j+1]>=dp[(i+1)*W+j])){ops.push(['x',b[j]]);j++}else{ops.push(['m',a[i]]);i++}}
  const match=dp[0],extra=m-match;return {ops,acc:n?100*match/(n+extra):(m?0:100),match,miss:n-match,extra,n};
}
function renderDiff(ops){let h='',cur=null,buf='';const fl=()=>{if(!buf)return;h+=cur==='='?esc(buf):`<span class="${cur}">${esc(buf)}</span>`;buf=''};
  for(const [t,c] of ops){if(t!==cur){fl();cur=t}buf+=c}fl();return h}

/* =========================================================
   AI判定（Claude API）
   ========================================================= */
const AI_SYS=`あなたは税理士試験「消費税法」理論の採点者です。受験生が理論テキスト（条文に沿った規定）を暗記して書いた解答を、正解テキストと比較して判定します。

判定方針:
- 句読点、番号記号、同義で法的意味が変わらない軽微な言い換えは許容します。
- 次のような「法的な意味が変わる誤り」は重大な誤り（critical_errors）として必ず指摘します：
  てにをは（助詞）の誤りによる主語・目的語・要件と効果の関係の変化、「及び／並びに／又は／若しくは」の取違え、
  「以上／超／以下／未満」、日付・期間の起算点や終期（日／前日／前々日／翌日、経過する日／経過した日）、
  数値・割合・金額、主体（誰が）、「しなければならない／できる／ものとする」、「とみなす／とする」、
  除外の括弧書きの欠落による適用範囲の変化、否定と肯定の逆転、要件と効果の入れ替わり。
- 単に書かれていない部分は omissions（脱落）として、重要なものだけ簡潔に列挙します。
- 「禁忌事項」が与えられた場合、解答がそれに違反していれば kinki_violations に、違反した禁忌事項の文言をそのまま rule に入れて記載します。
- meaning_ok は、書かれた内容に重大な誤りがなく、かつ規定の要件・効果の骨格が成立している場合に true とします。
- 解答が空や無関係な場合は meaning_ok=false とします。

出力は次のJSONオブジェクトのみ（前後に文章やコードフェンスを付けない）:
{"meaning_ok":true/false,"meaning_score":0〜100の整数（法的意味の再現度）,"critical_errors":[{"correct":"正解の該当箇所","written":"解答の該当箇所","reason":"意味がどう変わるか"}],"omissions":["脱落した重要部分"],"kinki_violations":[{"rule":"違反した禁忌事項","written":"解答の該当箇所","reason":"理由"}],"comment":"60字以内の講評"}`;
async function callAI(item,block,input){
  const kk=kinkiFor(item.id);
  const user=`【理論】${item.q}〔${item.no}〕${item.title}${block.h?'／'+block.h:''}
【禁忌事項】
${kk.length?kk.map((k,i)=>`${i+1}. ${k.text}`).join('\n'):'（なし）'}
【正解テキスト】
${tgt(block)}
【受験生の解答】
${input||'（空欄）'}`;
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':C.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:C.model,max_tokens:2000,system:AI_SYS,messages:[{role:'user',content:user}]})});
  if(!r.ok){let m='';try{m=(await r.json()).error.message}catch(e){}throw new Error('API '+r.status+(m?': '+m:''))}
  const j=await r.json();const txt=(j.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('');
  const s=txt.indexOf('{'),e=txt.lastIndexOf('}');if(s<0)throw new Error('AIの応答を解釈できませんでした');
  const o=JSON.parse(txt.slice(s,e+1));
  return {meaning_ok:!!o.meaning_ok,meaning_score:+o.meaning_score||0,critical_errors:o.critical_errors||[],omissions:o.omissions||[],kinki_violations:o.kinki_violations||[],comment:o.comment||''};
}

/* =========================================================
   GitHub 同期（非公開リポジトリに records.json / theory.json）
   ========================================================= */
const ghReady=()=>C.ghOwner&&C.ghRepo&&C.ghToken;
const b64e=s=>{const b=new TextEncoder().encode(s);let r='';for(let i=0;i<b.length;i+=0x8000)r+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(r)};
const b64d=s=>{const bin=atob(s.replace(/\n/g,''));const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return new TextDecoder().decode(b)};
async function gh(path,opt={}){const r=await fetch(`https://api.github.com/repos/${encodeURIComponent(C.ghOwner)}/${encodeURIComponent(C.ghRepo)}/contents/${path}`,
  {...opt,headers:{'Authorization':'Bearer '+C.ghToken,'Accept':opt.raw?'application/vnd.github.raw+json':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(opt.body?{'Content-Type':'application/json'}:{})},cache:'no-store'});
  return r}
async function ghGet(path){const r=await gh(path);if(r.status===404)return {sha:null,text:null};if(!r.ok)throw new Error('GitHub '+r.status);
  const j=await r.json();let text;if(j.content&&j.encoding==='base64')text=b64d(j.content);else{const rr=await gh(path,{raw:true});if(!rr.ok)throw new Error('GitHub '+rr.status);text=await rr.text()}
  return {sha:j.sha,text}}
async function ghPut(path,text,sha,msg){const r=await gh(path,{method:'PUT',body:JSON.stringify({message:msg,content:b64e(text),...(sha?{sha}:{})})});
  if(r.status===409||r.status===422)return false;if(!r.ok)throw new Error('GitHub '+r.status);return true}
function lww(a,b){const o={...a};for(const k in b){if(!o[k]||(b[k].u||0)>(o[k].u||0))o[k]=b[k]}return o}
function merge(L,R){if(!R)return L;
  const deleted={...L.deleted,...R.deleted};const attempts={...R.attempts,...L.attempts};for(const k in deleted)delete attempts[k];
  const pressure={...(R.pressure||{}),...(L.pressure||{})};for(const k in deleted)delete pressure[k];
  return {v:2,attempts,pressure,deleted,plan:lww(L.plan,R.plan),overrides:lww(L.overrides,R.overrides),kinki:lww(L.kinki,R.kinki),
    settings:Object.assign({},DEF_SET,(R.settings&&(R.settings.u||0)>(L.settings.u||0))?R.settings:L.settings),
    schedule:(R.schedule&&(!L.schedule||(R.schedule.u||0)>(L.schedule.u||0)))?R.schedule:(L.schedule||null)}}
let syncing=false,syncTimer=null,syncState={t:0,err:''};
function scheduleSync(){if(!ghReady())return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncNow(false),2500)}
async function syncNow(manual){
  if(!ghReady()){if(manual){tab='set';draw()}return}
  if(!navigator.onLine){syncState.err='オフライン';drawSync();return}
  if(syncing)return;syncing=true;drawSync();
  try{
    for(let tries=0;tries<4;tries++){
      const rem=await ghGet('records.json');const R=rem.text?JSON.parse(rem.text):null;
      const M=merge(S,R);const out=JSON.stringify(M);
      if(rem.text===out){S=M;break}
      if(await ghPut('records.json',out,rem.sha,`sync from ${C.device||'device'}`)){S=M;break}
      if(tries===3)throw new Error('競合が解消できませんでした');
    }
    sv(K_STATE,S);reindex();dirty=false;
    // 理論データ
    const remT=await ghGet('theory.json');
    if(!remT.text&&DATA){await ghPut('theory.json',JSON.stringify(DATA),null,'upload theory data')}
    else if(remT.text){const RD=JSON.parse(remT.text);
      if(!DATA||(RD.updated||0)>(DATA.updated||0)){setData(RD);sv(K_DATA,RD);toast('理論データを同期しました')}
      else if((DATA.updated||0)>(RD.updated||0)){await ghPut('theory.json',JSON.stringify(DATA),remT.sha,'update theory data')}}
    await syncNotes(manual);
    syncState={t:now(),err:''};if(manual)toast('同期しました');
    if(!run&&!pr)draw(1);
  }catch(e){syncState.err=e.message;if(manual)toast('同期エラー: '+e.message)}
  finally{syncing=false;drawSync()}
}
/* 解説データ（notes.json, 約6MB）：GitHub上のファイルが変わったときだけダウンロードする */
async function ghSha(path){const r=await fetch(`https://api.github.com/repos/${encodeURIComponent(C.ghOwner)}/${encodeURIComponent(C.ghRepo)}/contents/${path}`,
  {headers:{'Authorization':'Bearer '+C.ghToken,'Accept':'application/vnd.github.object+json','X-GitHub-Api-Version':'2022-11-28'},cache:'no-store'});
  if(r.status===404)return null;if(!r.ok)throw new Error('GitHub '+r.status);return (await r.json()).sha}
async function ghPutSha(path,text,sha,msg){const r=await gh(path,{method:'PUT',body:JSON.stringify({message:msg,content:b64e(text),...(sha?{sha}:{})})});
  if(!r.ok)throw new Error('GitHub '+r.status);const j=await r.json();return j.content&&j.content.sha}
async function syncNotes(manual){if(!notesLoaded)return;
  if(!manual&&C.notesFail&&now()-C.notesFail<6*3600e3)return;   // 失敗したら6時間は自動では再試行しない（大きいファイルのため）
  try{const sha=await ghSha('notes.json');
    if(!sha){if(NOTES){C.notesSha=await ghPutSha('notes.json',JSON.stringify(NOTES),null,'upload notes');saveConf()}return}
    if(sha===C.notesSha)return;
    const rr=await gh('notes.json',{raw:true});if(!rr.ok)throw new Error('GitHub '+rr.status);const RN=JSON.parse(await rr.text());
    if(!NOTES||(RN.updated||0)>=(NOTES.updated||0)){await setNotes(RN);C.notesSha=sha;saveConf();toast('解説データを同期しました')}
    else{C.notesSha=await ghPutSha('notes.json',JSON.stringify(NOTES),sha,'update notes');saveConf()}
    if(C.notesFail){C.notesFail=0;saveConf()}
  }catch(e){C.notesFail=now();saveConf();if(manual)toast('解説データの同期に失敗しました（'+e.message+'）。各端末で「解説データ.json」を読み込んでも使えます')}}
function drawSync(){const el=document.getElementById('sync');if(!ghReady()){el.textContent='同期：未設定';el.className='';return}
  if(syncing){el.innerHTML='<span class="spin"></span> 同期中';el.className='';return}
  if(syncState.err){el.textContent='同期エラー（タップで再試行）';el.className='err';return}
  el.textContent=syncState.t?('同期済み '+new Date(syncState.t).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})):'タップで同期';el.className=''}
window.addEventListener('online',()=>syncNow(false));

/* ---------- 時間計測 ----------

function touch(){TM.lastInput=performance.now()}

  el.innerHTML=`経過 ${fmtSec(TM.ms/1000)}<span class="sub" style="font-weight:400">　目安 ${fmtSec(goal)}${idle?'　（入力がないため一時停止中）':''}</span>`;el.className='timer'+(TM.ms/1000>goal?' over':'')}

function vAI(g){
  if(g.aiState==='poff')return `<div class="ai sub">AI判定：圧迫暗記ではオフ（圧迫暗記の一覧画面の「AI判定も使う」でオンにできます）</div>`;

  if(g.aiState==='pending')return `<div class="ai"><span class="spin"></span> AIが意味と禁忌事項を確認しています…</div>`;
  if(g.aiState==='skip')return `<div class="ai sub">AI判定をスキップしました</div>`;
  if(g.aiState==='error')return `<div class="ai"><span class="ng">AI判定エラー</span>：${esc(g.aiErr)} <button class="b s" onclick="runAI()">再試行</button></div>`;

const aiCE=a=>(a.critical_errors||[]).slice(0,5).map(e=>[String(e.correct||'').slice(0,40),String(e.written||'').slice(0,40)]);
function passOf(g){if(g.manual!=null)return g.manual;if(g.helped)return false;if(g.acc<S.settings.threshold)return false;
  if(g.ai&&(!g.ai.meaning_ok||g.ai.kinki_violations.length))return false;return true}
function grade(){const b=blocksOf(run.id)[run.i],hl=headLabel(b),input=hl?(run.hdraft||'')+'\n'+(run.draft||''):(run.draft||'');tick();TM.on=false;
  const T=norm(tgt(b)),d=withErr(diff(T,norm(input)),T),hd=hl?diff(norm(hl),norm(run.hdraft||'')):null;run.graded={...d,input,hd,hin:hl?run.hdraft||'':null,body:run.draft||'',sec:TM.ms/1000,helped:run.hint>0||run.peek,ai:null,aiState:aiReady()?'pending':'off',manual:null};
  draw();if(run.graded.aiState==='pending')runAI();else focusNext()}
function focusNext(){setTimeout(()=>{const n=document.getElementById('nx');n&&n.focus({preventScroll:true})},0)}
/* 採点中の区切り（通常の練習／圧迫暗記のどちらか） */
const curG=()=>pr?pr.g:(run&&run.graded);
function runAI(){const R=pr||run,g=curG(),it=BYID[R.id],b=blocksOf(R.id)[R.i];g.aiState='pending';draw(1);
  callAI(it,b,g.input).then(a=>{if(curG()===g){g.ai=a;g.aiState='done';draw(1);focusNext()}})
   .catch(e=>{if(curG()===g){g.aiState='error';g.aiErr=e.message;draw(1)}})}
function g_skipAI(){curG().aiState='skip';draw(1);focusNext()}
function g_flip(){const g=curG();g.manual=!passOf(g);draw(1)}
function retry(){const g=run.graded;if(g.hin!=null){run.hdraft=g.hin;run.draft=g.body||''}else run.draft=g.body!=null?g.body:g.input;run.graded=null;draw()}
function regKinki(k,scope){const R=pr||run,e=curG().ai.critical_errors[k];
  const txt=prompt('禁忌事項として登録する内容（編集できます）',`「${e.correct}」を「${e.written}」と書かない（${e.reason}）`);if(!txt)return;

function next(){const g=run.graded;if(!g||g.aiState==='pending')return;
  run.res.push({acc:Math.round(g.acc*10)/10,pass:passOf(g),n:g.n,m:g.match,sec:Math.round(g.sec),helped:g.helped,...errRec(g),
    ai:g.ai?{ok:g.ai.meaning_ok,score:g.ai.meaning_score,crit:g.ai.critical_errors.length,kinki:g.ai.kinki_violations.map(k=>k.rule),ce:aiCE(g.ai)}:null});
  run.i++;run.graded=null;run.hint=0;run.peek=false;run.draft='';run.hdraft='';TM.ms=0;TM.on=false;if(run.i>=blocksOf(run.id).length)record();draw()}
function record(){const tot=run.res.reduce((s,r)=>s+r.n,0)||1,acc=run.res.reduce((s,r)=>s+r.acc*r.n,0)/tot,pass=run.res.every(r=>r.pass),t=TODAY(),u=uid();

  S.attempts[u]={uid:u,ts:now(),date:t,id:run.id,acc:Math.round(acc*10)/10,pass,sec,dev:C.device||'',blocks:run.res};
  if(!planOf(t).includes(run.id))S.plan[t]={ids:[...planOf(t),run.id],u:now()};saveState();
  const a=S.attempts[u],sr=srsOf(run.id);run.summary={acc,pass,due:sr.due,sec,speed:speedOf(a),q:quality(a),iv:sr.iv}}
function vDone(){const it=BYID[run.id],s=run.summary,more=run.qi+1<run.queue.length;
  const nextToday=planOf().find(id=>id!==run.id&&!bestOn(id,TODAY()));
  const QMSG={fail:'正確さが足りないため、明日もう一度練習します。',slow:'正確に書けましたが時間がかかっています。まだ思い出すのに苦労している段階なので、復習の間隔は伸ばしません。',good:'正確に、十分な速さで書けました。復習の間隔を伸ばします。',great:'正確かつ速く書けています。復習の間隔を大きく伸ばします。'};
  return `<div class="card">${itemLabel(it)}<div class="row" style="margin:14px 0"><span class="big ${s.pass?'ok':'ng'}">${s.pass?'○ 合格':'× 要復習'}</span><span class="big">${pct(s.acc)}</span>
   <span class="big" style="font-size:22px">${fmtSec(s.sec)}</span><span class="sub">${s.speed?Math.round(s.speed)+'字/分':''}${s.q==='slow'?' <span class="slow">遅</span>':''}</span></div>
  <p style="margin:0 0 8px">${QMSG[s.q]}</p>
  <table>${run.res.map((r,k)=>`<tr><td>区切り${k+1} ${esc(blocksOf(run.id)[k].h||'')}</td><td class="n">${pct(r.acc)}</td><td class="n sub">${fmtSec(r.sec)}</td><td>${r.pass?'<span class="ok">○</span>':'<span class="ng">×</span>'}
   ${r.ai?(r.ai.ok?'<span class="pill">意味OK</span>':'<span class="pill ng">意味NG</span>'):''}${r.ai&&r.ai.kinki.length?' <span class="pill ng">禁忌違反</span>':''}${r.helped?' <span class="pill w">ヒント使用</span>':''}</td></tr>`).join('')}</table>
  <p class="sub">次回の復習日：${s.due}（${s.iv}日後）</p><div class="row">
  ${more?`<button class="b p" id="nx" onclick="nextInQueue()">次の理論へ（${run.queue[run.qi+1]}） <kbd>Enter</kbd></button>`:nextToday?`<button class="b p" onclick="startQueue(['${nextToday}'])">今日の次の理論へ（${nextToday}）</button>`:''}
  <button class="b" onclick="startQueue(['${run.id}'])">もう一度</button><button class="b" onclick="openRead('${it.q}','${run.id}')">条文と解説を読む</button><button class="b" onclick="go(tab)">戻る</button></div></div>`}
function nextInQueue(){const q=run.queue,qi=run.qi+1;TM.ms=0;TM.on=false;run={queue:q,qi,id:q[qi],i:0,res:[],graded:null,hint:0,peek:false,draft:'',edit:false};draw()}
function saveEdit(){const B=structuredClone(blocksOf(run.id));B[run.i]={h:document.getElementById('eh').value.trim()||null,t:document.getElementById('et').value};
  S.overrides[run.id]={blocks:B,u:now()};saveState();run.edit=false;draw()}
function resetEdit(){if(!confirm('この理論の編集を取り消しますか？'))return;S.overrides[run.id]={blocks:null,u:now()};saveState();run.edit=false;draw()}
document.addEventListener('keydown',e=>{if((!run&&!pr)||e.key!=='Enter'||e.ctrlKey||e.metaKey||e.isComposing)return;const a=document.activeElement;
  if(a&&(a.tagName==='TEXTAREA'||a.tagName==='INPUT'||a.id==='nx'))return;
  if(pr){if(pr.ph==='ready'){e.preventDefault();pBegin()}else if(pr.ph==='graded'&&pr.g.aiState!=='pending'){e.preventDefault();pNext()}
    else if(pr.ph==='done'&&pr.qi+1<pr.queue.length){e.preventDefault();pNextQ()}return}
  if(run.graded&&run.graded.aiState!=='pending'){e.preventDefault();next()}else if(run.summary&&run.i>=blocksOf(run.id).length&&run.qi+1<run.queue.length){e.preventDefault();nextInQueue()}});

/* =========================================================
   圧迫暗記
   区切りごとに「字数 × 秒/字」の時間だけ正解テキストを表示 → 隠して即テスト。
   合格するたびに、その理論の秒/字を一段短くする（不合格なら同じ段階のまま）。
   覚えやすさ = 正しく書けた字数の合計 ÷ 覚えるのに使った時間の合計（字/分）。
   記録は S.pressure に通常の練習とは別に保存（マップの色・復習間隔には影響しない）
   ========================================================= */
const PLV=[2.0,1.5,1.2,1.0,0.8,0.6],P_MIN=15;
function pAtt(id){return PRA[id]||[]}
function pLevel(id){let lv=0;for(const a of pAtt(id))if(a.pass)lv=Math.min(lv+1,PLV.length-1);return lv}
function pAllot(b,spc){return Math.max(P_MIN,Math.ceil(norm(tgt(b)).length*spc))}
function easeRaw(list){let m=0,s=0;for(const x of list){m+=x.m||0;s+=Math.max(3,x.study||0)}return s>0?m/(s/60):null}
function easeOf(id){return easeRaw(pAtt(id).flatMap(a=>a.blocks||[]))}
/* 易・普・難：計測済みの理論の中で下位1/3＝難、上位1/3＝易（6件未満のうちは 30字/分未満＝難、50字/分以上＝易） */
function easeCuts(){const v=ITEMS.map(i=>easeOf(i.id)).filter(x=>x!=null).sort((a,b)=>a-b);
  if(v.length<6)return [30,50];return [v[Math.floor(v.length/3)],v[Math.floor(v.length*2/3)]]}
function easeClass(id){const v=easeOf(id);if(v==null)return null;if(!EZ_CUT)EZ_CUT=easeCuts();return v<EZ_CUT[0]?'h':v>=EZ_CUT[1]?'e':'m'}
const EZL={e:['易','ez-e'],m:['普','ez-m'],h:['難','ez-h']};
const ezTag=c=>c?`<span class="ez ${EZL[c][1]}">${EZL[c][0]}</span>`:'';

/* 時間：アプリが前面にある時間だけ数える */
const PT={ms:0,last:0,on:false,iv:null};
function ptAdd(){const t=performance.now();if(PT.on&&document.visibilityState==='visible')PT.ms+=t-PT.last;PT.last=t}
function pTimer(on){PT.ms=0;PT.last=performance.now();PT.on=on;if(!PT.iv)PT.iv=setInterval(ptick,250)}
function ptick(){ptAdd();if(!pr)return;
  if(pr.ph==='study'){const left=pr.allot-PT.ms/1000,el=document.getElementById('pcd'),bar=document.getElementById('pbar');
    if(el){el.textContent=fmtSec(Math.max(0,Math.ceil(left)));el.className='cd'+(left<=10?' low':'')}
    if(bar)bar.style.width=Math.max(0,100*left/pr.allot)+'%';
    if(left<=0)endStudy(true)}
  else if(pr.ph==='test'){const el=document.getElementById('ptm');if(el)el.textContent='テスト経過 '+fmtSec(PT.ms/1000)}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')PT.last=performance.now();else ptAdd()});

function pNew(id){return {id,lv:pLevel(id),ph:'ready',i:0,res:[],draft:'',hdraft:'',g:null}}
function pQueue(ids){ids=(ids||[]).filter(id=>BYID[id]);if(!ids.length)return;if(!pr&&!okNew('pr'))return;if(run)leaveSession();rd=null;run=null;TM.on=false;pr={queue:ids,qi:0,...pNew(ids[0])};draw()}
function pNextQ(){const q=pr.queue,qi=pr.qi+1;pr={queue:q,qi,...pNew(q[qi])};draw()}
function pBegin(){if(!pr)return;pr.ph='study';pr.allot=pAllot(blocksOf(pr.id)[pr.i],PLV[pr.lv]);pr.draft='';pr.hdraft='';pTimer(true);draw()}
function endStudy(auto){if(!pr||pr.ph!=='study')return;ptAdd();
  pr.study=Math.min(pr.allot,Math.round(PT.ms/100)/10);pr.ph='test';pTimer(true);draw();if(auto)toast('時間です。すぐに書いてください')}
function pGrade(){if(!pr||pr.ph!=='test')return;ptAdd();PT.on=false;
  const b=blocksOf(pr.id)[pr.i],hl=headLabel(b),input=hl?(pr.hdraft||'')+'\n'+(pr.draft||''):(pr.draft||''),d=withErr(diff(norm(tgt(b)),norm(input)),norm(tgt(b)));
  const hd=hl?diff(norm(hl),norm(pr.hdraft||'')):null;
  const st=!C.pressAI?'poff':aiReady()?'pending':'off';
  pr.g={...d,input,hd,hin:pr.hdraft||'',sec:PT.ms/1000,helped:false,ai:null,aiState:st,manual:null};pr.ph='graded';draw();if(st==='pending')runAI()}
function pNext(){const g=pr&&pr.g;if(!g||g.aiState==='pending')return;const b=blocksOf(pr.id)[pr.i];
  pr.res.push({h:b.h||'',n:g.n,m:g.match,acc:Math.round(g.acc*10)/10,pass:passOf(g),allot:pr.allot,study:pr.study,test:Math.round(g.sec),...errRec(g),
    ai:g.ai?{ok:g.ai.meaning_ok,score:g.ai.meaning_score,kinki:g.ai.kinki_violations.map(k=>k.rule),ce:aiCE(g.ai)}:null});
  pr.i++;pr.g=null;pr.draft='';
  if(pr.i<blocksOf(pr.id).length){pBegin();return}
  pRecord();pr.ph='done';draw()}
function pRecord(){const R=pr.res,tot=R.reduce((s,r)=>s+r.n,0)||1,u=uid();
  const a={uid:u,ts:now(),date:TODAY(),id:pr.id,dev:C.device||'',lv:pr.lv,spc:PLV[pr.lv],acc:Math.round(R.reduce((s,r)=>s+r.acc*r.n,0)/tot*10)/10,
    pass:R.every(r=>r.pass),study:Math.round(R.reduce((s,r)=>s+r.study,0)),test:R.reduce((s,r)=>s+r.test,0),blocks:R};
  S.pressure[u]=a;saveState();pr.rec=a}

function vPress(){const it=BYID[pr.id],B=blocksOf(pr.id),spc=PLV[pr.lv];
  const qtxt=pr.queue.length>1?`<span class="pill">${pr.qi+1} / ${pr.queue.length} 理論目</span>`:'';
  let h=`<div class="card"><div class="row"><div class="grow"><span class="kind k-speed">圧迫暗記</span>${itemLabel(it)}</div>${qtxt}${stars(it.stars)}<button class="b s" onclick="${pr.ph==='done'?"go('press')":'quitAsk()'}">${pr.ph==='done'?'閉じる':'中断'}</button></div>`;
  if(pr.ph==='done')return h+vPDone()+'</div>';
  h+=`<div class="prog">${B.map((_,k)=>`<span class="${k<pr.res.length?(pr.res[k].pass?'ok':'ng'):k===pr.i?'cur':''}"></span>`).join('')}</div>`;
  if(pr.ph==='ready'&&pr.i>0){const tot=B.slice(pr.i).reduce((s,b)=>s+pAllot(b,spc),0);
    return h+`<p><b>中断したところから再開します。</b>区切り ${pr.i+1} / ${B.length} から（${spc.toFixed(1)}秒/字・残りの覚える時間 ${fmtSec(tot)}）。</p>
     <div class="row"><button class="b p" id="nx" onclick="pBegin()">区切り ${pr.i+1} から再開 <kbd>Enter</kbd></button></div></div>`}
  if(pr.ph==='ready'){const tot=B.reduce((s,b)=>s+pAllot(b,spc),0),A=pAtt(pr.id);
    return h+`<p>区切りごとに、正解テキストが <b>${spc.toFixed(1)}秒/字</b> の時間だけ表示されます。時間が来ると隠れるので、すぐに思い出して書いてください。早く覚えられたら「覚えた」で先に進めます。</p>
     <div class="stats"><div class="stat"><span class="sub">区切り</span><b>${B.length}</b></div><div class="stat"><span class="sub">字数</span><b>${charsOf(pr.id)}</b></div>
     <div class="stat"><span class="sub">覚える時間（合計）</span><b>${fmtSec(tot)}</b></div><div class="stat"><span class="sub">これまでの圧迫暗記</span><b>${A.length}<span class="sub"> 回${A.length?'（合格'+A.filter(a=>a.pass).length+'）':''}</span></b></div></div>
     <div class="field"><label>段階（合格するたびに自動で一段短くなります。ここで変えることもできます）</label><div class="seg">${PLV.map((v,k)=>`<button class="${k===pr.lv?'on':''}" onclick="pr.lv=${k};draw(1)">${v.toFixed(1)}秒/字</button>`).join('')}</div></div>
     <div class="row"><button class="b p" id="nx" onclick="pBegin()">開始 <kbd>Enter</kbd></button></div></div>`}
  const b=B[pr.i],head=headHTML(b);
  h+=`<div class="sub">区切り ${pr.i+1} / ${B.length}・${spc.toFixed(1)}秒/字</div><div class="prompt">${head}</div>`;
  if(pr.ph==='study')
    return h+`<div class="row" style="align-items:center"><span id="pcd" class="cd">${fmtSec(pr.allot)}</span><span class="sub">${norm(tgt(b)).length}字を ${fmtSec(pr.allot)} で覚える</span><span class="grow"></span><button class="b p" onclick="endStudy(false)">覚えた → テストへ</button></div>
     <div class="bar cdb" style="margin:8px 0 10px"><i id="pbar" style="width:100%"></i></div><div class="studytext">${esc(tgt(b))}</div></div>`;
  if(pr.ph==='test')
    return h+`<div class="row" style="margin-bottom:6px"><span id="ptm" class="timer">テスト経過 0:00</span><span class="sub">覚えた時間 ${fmtSec(pr.study)}</span></div>
     ${headLabel(b)?`<div class="field" style="margin-top:0"><label>見出し</label><input type="text" id="phead" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" value="${esc(pr.hdraft)}" placeholder="見出しを入力（例：課税の対象）" oninput="pr.hdraft=this.value" onkeydown="if(event.isComposing)return;if(event.key==='Enter'){event.preventDefault();if(event.ctrlKey||event.metaKey)pGrade();else document.getElementById('pans').focus()}"></div><label class="sub">本文</label>`:''}
     <textarea id="pans" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="今覚えた内容を入力" oninput="pr.draft=this.value" onkeydown="if((event.ctrlKey||event.metaKey)&&event.key==='Enter'){event.preventDefault();pGrade()}">${esc(pr.draft)}</textarea>
     <div class="row" style="margin-top:10px"><button class="b p" onclick="pGrade()">採点 <kbd>Ctrl/⌘+Enter</kbd></button></div></div>`;
  const g=pr.g,pass=passOf(g);
  return h+`<div class="row" style="margin:6px 0 8px"><span class="big ${pass?'ok':'ng'}">${pass?'○':'×'} ${pct(g.acc)}</span>
   <span class="sub">覚えた時間 ${fmtSec(pr.study)}／${fmtSec(pr.allot)}・テスト ${fmtSec(g.sec)}<br>脱落 ${g.miss}字・余分 ${g.extra}字／正解 ${g.n}字（見出しを含む）</span><span class="grow"></span>
   <button class="b s" onclick="g_flip()">${pass?'×にする':'○にする'}</button></div>
   <div class="sub" style="margin-bottom:6px"><span style="background:var(--miss);padding:0 4px">赤＝書けなかった</span>　<span style="background:var(--extra);text-decoration:line-through;padding:0 4px">灰＝余分</span></div>
   ${g.hd?`<div style="margin-bottom:6px">見出し：${g.hd.miss||g.hd.extra?'<span class="ng">×</span>':'<span class="ok">○</span>'} 正解「${esc(headLabel(b))}」${g.hd.miss||g.hd.extra?`／あなた「${esc(g.hin)||'（空欄）'}」`:''}</div>`:''}
   <div class="diff">${renderDiff(g.ops)}</div>${recurHTML(pr.id,pr.i,g)}${vAI(g)}
   <div class="row" style="margin-top:12px"><button class="b p" id="nx" onclick="pNext()" ${g.aiState==='pending'?'disabled':''}>${pr.i+1<B.length?'次の区切りへ（すぐ表示が始まります）':'結果を記録'} <kbd>Enter</kbd></button>
   ${g.aiState==='pending'?`<button class="b" onclick="g_skipAI()">AI判定を待たずに進む</button>`:''}<span class="grow"></span><button class="b s" onclick="editBlock(pr.id,pr.i)">正解テキストを修正</button></div>
   ${g.regraded?`<p class="sub">修正した正解テキストで採点し直しました。</p>`:''}</div>`}
function vPDone(){const a=pr.rec,more=pr.qi+1<pr.queue.length,nl=pLevel(pr.id),ez=easeOf(pr.id);
  return `<div class="row" style="margin:14px 0"><span class="big ${a.pass?'ok':'ng'}">${a.pass?'○ 合格':'× 不合格'}</span><span class="big">${pct(a.acc)}</span>
   <span class="sub">${a.spc.toFixed(1)}秒/字・覚えた時間 ${fmtSec(a.study)}・テスト ${fmtSec(a.test)}</span></div>
  <p style="margin:0 0 8px">${a.pass?(a.lv<PLV.length-1?`合格です。次回は <b>${PLV[nl].toFixed(1)}秒/字</b> に短くなります。`:'最短の段階で合格しました。'):`次回も <b>${PLV[nl].toFixed(1)}秒/字</b> で挑戦します。`}</p>
  <table><tr><th>区切り</th><th class="n">精度</th><th class="n">覚えた時間</th><th class="n hide-sm">覚えやすさ</th><th></th></tr>${a.blocks.map((r,k)=>`<tr><td>区切り${k+1} ${esc(r.h)}</td><td class="n">${pct(r.acc)}</td><td class="n sub">${fmtSec(r.study)}／${fmtSec(r.allot)}</td>
   <td class="n sub hide-sm">${r.study?Math.round(r.m/(r.study/60))+'字/分':''}</td><td>${r.pass?'<span class="ok">○</span>':'<span class="ng">×</span>'}${r.ai&&!r.ai.ok?' <span class="pill ng">意味NG</span>':''}${r.ai&&r.ai.kinki.length?' <span class="pill ng">禁忌違反</span>':''}</td></tr>`).join('')}</table>
  <p class="sub">この理論の覚えやすさ：${ez!=null?Math.round(ez)+'字/分 '+ezTag(easeClass(pr.id)):'–'}（これまでの圧迫暗記で、覚えるのに使った1分あたりに正しく書けた字数）</p>
  <div class="row">${more?`<button class="b p" id="nx" onclick="pNextQ()">次の理論へ（${pr.queue[pr.qi+1]}） <kbd>Enter</kbd></button>`:''}
  <button class="b" onclick="pQueue(['${pr.id}'])">もう一度</button><button class="b" onclick="startQueue(['${pr.id}'])">通常の練習で記録する</button><button class="b" onclick="openRead('${BYID[pr.id].q}','${pr.id}')">条文と解説を読む</button><button class="b" onclick="go('press')">圧迫暗記の一覧へ</button></div>`}

function vPList(){const all=Object.values(PRA).flat().sort((a,b)=>b.ts-a.ts),done=ITEMS.filter(i=>pAtt(i.id).length);
  const p=planOf().filter(id=>BYID[id]),nextNew=[...ITEMS.filter(i=>i.stars>=2),...ITEMS.filter(i=>i.stars<2)].find(i=>!pAtt(i.id).length);
  const ezAll=easeRaw(all.flatMap(a=>a.blocks||[]));
  let h=vSuspCards()+`<div class="card"><h2>圧迫暗記</h2><p class="sub" style="margin-top:0">区切りごとに、字数に応じた短い時間だけ正解テキストを表示し、隠したらすぐに書いてテストします。覚える時間は ${PLV.map(v=>v.toFixed(1)).join(' → ')} 秒/字 と、その理論で合格するたびに一段ずつ短くなります。
   短い時間で覚えられた理論・区切りほど「覚えやすい」、時間をかけても書けない所ほど「覚えにくい」ものとしてデータが貯まります。</p>
   <p class="sub">この記録は通常の練習とは別に保存し、マップの色や復習間隔には影響しません（覚えにくい理論には、マップに <span class="ez ez-h">難</span> が付きます）。AIスケジュールにも覚えやすさを渡します。</p>
   <div class="row"><button class="b p" onclick="pQueue(${esc(JSON.stringify(p))})" ${p.length?'':'disabled'}>今日の予定を圧迫暗記（${p.length}件）</button>
   ${nextNew?`<button class="b" onclick="pQueue(['${nextNew.id}'])">まだやっていない次の理論（${nextNew.q}〔${nextNew.no}〕）</button>`:''}<button class="b" onclick="go('map')">マップから選ぶ</button>
   <span class="grow"></span><label class="sub"><input type="checkbox" ${C.pressAI?'checked':''} onchange="C.pressAI=this.checked;saveConf()"> AI判定も使う（APIの利用料がかかります）</label></div></div>
   <div class="card"><div class="stats"><div class="stat"><span class="sub">実施した理論</span><b>${done.length}<span class="sub"> / ${ITEMS.length}</span></b></div>
   <div class="stat"><span class="sub">圧迫暗記の回数</span><b>${all.length}</b></div><div class="stat"><span class="sub">合格率</span><b>${all.length?pct(100*all.filter(a=>a.pass).length/all.length):'–'}</b></div>
   <div class="stat"><span class="sub">全体の覚えやすさ</span><b>${ezAll!=null?Math.round(ezAll):'–'}<span class="sub"> 字/分</span></b></div>
   <div class="stat"><span class="sub">覚えにくい（難）</span><b>${done.filter(i=>easeClass(i.id)==='h').length}</b></div></div></div>`;
  if(!done.length)return h+`<div class="card empty">まだ記録がありません。上のボタンか、マップの理論を開いて「圧迫」から始めてください。</div>`;
  const srt={hard:(a,b)=>easeOf(a.id)-easeOf(b.id),easy:(a,b)=>easeOf(b.id)-easeOf(a.id),order:()=>0}[C.pSort]||(()=>0);

const KIND={new:['新規','k-new'],review:['復習','k-review'],fix:['やり直し','k-fix'],speed:['スピード','k-speed']};
const kindTag=k=>KIND[k]?`<span class="kind ${KIND[k][1]}">${KIND[k][0]}</span>`:'';
function budgetOf(d){const w=new Date(d+'T00:00:00').getDay();return (w===0||w===6)?S.settings.minWeekend:S.settings.minWeekday}
function kindMap(d){const day=S.schedule&&S.schedule.days.find(x=>x.date===d);const m={};if(day)day.items.forEach(i=>m[i.id]=i.kind);return m}
function kindNow(id){const l=lastOf(id);if(!l)return 'new';if(!l.pass)return 'fix';if(speedClass(l)==='slow')return 'speed';return 'review'}
function overview(){const t=TODAY(),un=ITEMS.filter(i=>!attemptsOf(i.id).length);
  const exam=S.settings.examDate,left=exam?daysBetween(t,exam):null;
  const needMin=un.reduce((s,i)=>s+estNew(i.id),0);
  let avail=null;if(left!=null&&left>0){avail=0;for(let k=0;k<left;k++)avail+=budgetOf(addDays(t,k))}
  return {un:un.length,un2:un.filter(i=>i.stars>=2).length,left,needMin,avail,
    red:ITEMS.filter(i=>{const l=lastOf(i.id);return l&&!l.pass}).length,slow:ITEMS.filter(i=>isSlow(i.id)).length,
    green:ITEMS.filter(i=>{const l=lastOf(i.id);return l&&l.pass&&!isSlow(i.id)}).length,due:dueList().length}}
/* AIなしの自動作成：復習日が来たもの（やり直し→スピード→復習）を優先し、残り時間の6割までで新規を進める */
function localPlan(){const st=S.settings,days=[],t=TODAY(),H=st.horizon;
  const sim={};ITEMS.forEach(i=>{const s=srsOf(i.id);sim[i.id]=s?{due:s.due,idx:STEPS.indexOf(s.iv),kind:kindNow(i.id)}:null});
  const order=[...ITEMS.filter(i=>i.stars>=2),...ITEMS.filter(i=>i.stars<2)].map(i=>i.id);
  const rank={fix:0,speed:1,review:2};
  for(let k=0;k<H;k++){const d=addDays(t,k),bud=budgetOf(d);let used=0;const items=[];
    if(bud>0){
      const due=Object.entries(sim).filter(([id,s])=>s&&s.due<=d).sort((a,b)=>rank[a[1].kind]-rank[b[1].kind]||a[1].due.localeCompare(b[1].due)||BYID[b[0]].stars-BYID[a[0]].stars);
      for(const [id,s] of due){const m=estPractice(id);if(used+m>bud*1.05)continue;items.push({id,kind:s.kind,min:Math.round(m)});used+=m;
        s.idx=Math.min((s.kind==='fix'?0:s.idx)+1,STEPS.length-1);s.due=addDays(d,STEPS[s.idx]);s.kind='review'}
      let nu=0;
      for(const id of order){if(sim[id])continue;const m=estNew(id);
        if((used+m>bud*1.05&&items.length)||(nu+m>bud*0.7&&nu>0))break;
        items.push({id,kind:'new',min:Math.round(m)});used+=m;nu+=m;sim[id]={due:addDays(d,1),idx:0,kind:'review'}}
    }
    days.push({date:d,items,note:''})}
  return {by:'auto',created:now(),strategy:'復習日が来た理論（不合格→正確だが遅い理論→通常の復習）を優先し、残り時間の7割までで★★から教科書順に新しい理論を進める自動計画です。',milestones:[],days}}
const PLAN_SYS=`あなたは税理士試験「消費税法」の理論暗記を指導する学習計画の専門家です。受験生の学習記録（精度と所要時間）と条件から、日別の暗記スケジュールを作ります。

計画の原則:
1. 暗記の質は「正確さ」と「速さ（思い出す時間）」の両方で評価する。精度が高くても時間がかかっている理論（速度判定=遅）は、まだ定着していないものとして扱い、2〜3日以内に「speed」として再練習を入れる。
2. 不合格（精度不足・意味の誤り・禁忌違反）の理論は「fix」として翌日〜2日以内に入れる。
3. 復習日（次回期限）が来た理論は「review」として期限どおりに入れる。期限より大幅に早い復習は入れない。
4. 残りの時間で未学習の理論を「new」として進める。★★を優先し、同じ問題番号（例：2-1の〔1〕〔2〕…）はなるべく同じ日か連続した日にまとめ、教科書順を基本とする。新規を入れた翌日・数日後には必ず復習が発生することを見越して、新規の量を調整する。
5. 試験日が与えられている場合、試験日までに全理論を一巡し、その後に反復できるよう逆算する。間に合わない場合は★★を優先し、その旨を strategy に書く。
6. 各日の合計見込み時間（min の合計）は、その日の使える時間を超えない（最大+10%）。使える時間が0分の日は空にする。
7. min には与えられた見込み時間（新規なら「新規見込み」、それ以外は「練習見込み」）を基本として使う。
8. 「覚えやすさ」は圧迫暗記（短時間だけ見て即テスト）で測った、覚えるのに使った1分あたりに正しく書けた字数で、空欄は未計測。「難」の理論は覚えにくいので、新規なら早めに着手して min に2〜3割の余裕を持たせ、復習も間隔を詰める。「易」の理論は後回しにしてよい。
9. 「くり返し間違い」は、同じ言い回しを2回以上書き間違え、まだ直っていない箇所の数。多い理論は、誤った言い回しが定着しかけているので、合格していても fix として早めに練習に入れる。

出力は次のJSONオブジェクトのみ（前後に文章やコードフェンスを付けない）:
{"strategy":"全体方針（250字以内）","milestones":["節目となる目標（例：11月末までに★★を一巡）"],"days":[{"date":"YYYY-MM-DD","items":[{"id":"理論ID","kind":"new|review|fix|speed","min":整数}],"note":"その日の狙い（40字以内）"}]}`;

  const last=[];for(let k=29;k>=0;k--){const d=addDays(TODAY(),-k),A=days[d]||[];last.push({d,n:A.length,avg:A.length?A.reduce((s,a)=>s+a.acc,0)/A.length:null})}
  const W=900,H=170,bw=W/30;let svg=`<svg viewBox="0 0 ${W} ${H+24}" style="width:100%;height:auto">`;
  [0,50,100].forEach(v=>{const y=H-v/100*H;svg+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="#e2e0da"/><text x="2" y="${y-3}" font-size="11" fill="#646b73">${v}%</text>`});
  last.forEach((x,k)=>{if(x.avg!=null){const hh=Math.max(2,x.avg/100*H);svg+=`<rect x="${k*bw+4}" y="${H-hh}" width="${bw-8}" height="${hh}" rx="3" fill="rgb(${x.avg>=S.settings.threshold?'47,143,91':'200,71,58'})"><title>${x.d} 平均${Math.round(x.avg)}%（${x.n}回）</title></rect>`}
    if(k%5===4||k===29)svg+=`<text x="${k*bw+bw/2}" y="${H+16}" font-size="11" fill="#646b73" text-anchor="middle">${x.d.slice(5)}</text>`});svg+=`</svg>`;
  h+=`<div class="card"><h2>直近30日の平均精度</h2>${svg}</div><div class="card"><h2>日別</h2>`;
  if(!ds.length)h+=`<div class="empty">まだ記録がありません</div>`;else{h+=`<table><tr><th>日付</th><th class="n">回数</th><th class="n">理論数</th><th class="n">平均精度</th><th class="n">合格率</th><th class="n">学習時間</th></tr>`;
    ds.slice().reverse().forEach(d=>{const A=days[d];h+=`<tr><td>${d}</td><td class="n">${A.length}</td><td class="n">${new Set(A.map(a=>a.id)).size}</td><td class="n">${pct(A.reduce((s,a)=>s+a.acc,0)/A.length)}</td><td class="n">${pct(100*A.filter(a=>a.pass).length/A.length)}</td><td class="n">${fmtMin(A.reduce((s,a)=>s+(a.sec||0),0)/60)}</td></tr>`});h+=`</table>`}
  h+=`</div><div class="card"><h2>練習履歴</h2>`;
  if(all.length){h+=`<table><tr><th>日時</th><th>理論</th><th class="n">精度</th><th class="n">時間</th><th class="n hide-sm">速度</th><th>判定</th><th></th></tr>`;
    all.slice().reverse().slice(0,300).forEach(a=>{const it=BYID[a.id],t=new Date(a.ts),kin=a.blocks&&a.blocks.some(b=>b.ai&&b.ai.kinki&&b.ai.kinki.length);
      h+=`<tr><td class="sub">${a.date.slice(5)} ${pad(t.getHours())}:${pad(t.getMinutes())}${a.dev?'<br>'+esc(a.dev):''}</td><td>${it?`${it.q}〔${it.no}〕 ${esc(it.title)}`:esc(a.id)}</td><td class="n">${pct(a.acc)}</td><td class="n">${a.sec?fmtSec(a.sec):'–'}</td><td class="n hide-sm">${speedOf(a)?Math.round(speedOf(a))+'字/分':'–'}${isSlowA(a)?' <span class="slow">遅</span>':''}</td>
      <td>${a.pass?'<span class="ok">○</span>':'<span class="ng">×</span>'}${kin?' <span class="pill ng">禁忌</span>':''}</td><td class="n"><button class="b s" onclick="delA('${a.uid}')">削除</button></td></tr>`});h+=`</table>`}
  else h+=`<div class="empty">まだ記録がありません</div>`;return h+`</div>`}

function vKinki(){const all=Object.entries(S.kinki).filter(([k,v])=>!v.del);const g=all.filter(([k,v])=>v.scope==='g'),it=all.filter(([k,v])=>v.scope!=='g').sort((a,b)=>a[1].scope.localeCompare(b[1].scope,undefined,{numeric:true}));

  return `<div class="card"><h2>禁忌事項とは</h2><p class="sub" style="margin:0">書き間違えると規定の意味が変わってしまう、絶対に避けたい誤りのリストです。AI判定がこのリストに照らして解答を確認し、違反があればその区切りは文字の一致率に関係なく不合格（赤）になります。AIが指摘した「意味が変わる誤り」から、ワンタップで登録することもできます。</p></div>

function addK(scope){if(!scope){scope=prompt('対象の理論番号（例：2-1-1 ＝ 問題2-1の〔1〕）');if(!scope)return;scope=scope.normalize('NFKC').trim().replace(/[〔〕\s]/g,'-').replace(/-+/g,'-').replace(/-$/,'');if(!BYID[scope]){alert('その理論番号が見つかりません');return}}
  const t=prompt('禁忌事項の内容');if(!t)return;S.kinki[uid()]={scope,text:t.trim(),u:now()};saveState();draw(1)}
