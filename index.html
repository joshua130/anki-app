/* =========================================================
   中断と再開
   練習・圧迫暗記の途中経過を端末に保存しておき、あとで「続きから再開」できる。
   画面を切り替えたとき・アプリを閉じたとき（裏に回ったとき）も自動で保存する。
   - 練習：終わった区切りの結果・採点済みの区切り・書きかけの解答・経過時間をそのまま残す
   - 圧迫暗記：終わった区切りの結果を残す。表示中・テスト中の区切りは、再開時に覚えるところからやり直す
   ========================================================= */
function runSnap(){if(!run||!BYID[run.id])return null;const n=blocksOf(run.id).length;
  if(run.i>=n){const qi=run.qi+1;return qi<run.queue.length?{queue:run.queue,qi,id:run.queue[qi],i:0,res:[],graded:null,hint:0,peek:false,draft:'',tm:0}:null}
  if(!(run.i>0||run.res.length||run.graded||(run.draft||'').trim()||(run.hdraft||'').trim()||run.qi>0))return null;
  const g=run.graded?{...run.graded,...(run.graded.aiState==='pending'?{aiState:'error',aiErr:'中断したためAI判定が終わっていません'}:{})}:null;
  return {queue:run.queue,qi:run.qi,id:run.id,i:run.i,res:run.res,graded:g,hint:run.hint,peek:run.peek,draft:run.draft||'',hdraft:run.hdraft||'',tm:g?0:TM.ms}}
function prSnap(){if(!pr||!BYID[pr.id])return null;
  if(pr.ph==='done'){const qi=pr.qi+1;return qi<pr.queue.length?{queue:pr.queue,qi,...pNew(pr.queue[qi])}:null}
  if(!(pr.i>0||pr.res.length||pr.ph!=='ready'||pr.qi>0))return null;
  const s={queue:pr.queue,qi:pr.qi,id:pr.id,lv:pr.lv,i:pr.i,res:pr.res,ph:'ready',draft:'',hdraft:'',g:null};
  if(pr.ph==='graded'){s.ph='graded';s.allot=pr.allot;s.study=pr.study;
    s.g={...pr.g,...(pr.g.aiState==='pending'?{aiState:'error',aiErr:'中断したためAI判定が終わっていません'}:{})}}
  return s}
function saveSusp(){if(!run&&!pr)return false;let saved=false;
  if(run){if(TM.on)tick();const s=runSnap();if(s){SUSP.run={...s,at:now()};saved=true}else delete SUSP.run}
  if(pr){const s=prSnap();if(s){SUSP.pr={...s,at:now()};saved=true}else delete SUSP.pr}
  sv(K_SUSP,SUSP);return saved}
let suspT=null;
function suspSoon(){clearTimeout(suspT);suspT=setTimeout(()=>{if(run||pr)saveSusp()},1500)}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&(run||pr))saveSusp()});
window.addEventListener('pagehide',()=>{if(run||pr)saveSusp()});
function suspDesc(k){const s=SUSP[k];if(!s||!BYID[s.id])return null;const it=BYID[s.id],n=blocksOf(s.id).length;
  const pos=k==='run'&&s.graded?`区切り ${s.i+1} / ${n}（採点済み）`:k==='pr'&&s.ph==='graded'?`区切り ${s.i+1} / ${n}（採点済み）`:`区切り ${s.i+1} / ${n} から`;
  return {it,pos,q:s.queue.length>1?`（${s.qi+1} / ${s.queue.length} 理論目）`:''}}
function vSuspCards(){let h='';
  for(const [k,lab,fn] of [['run','練習','resumeRun'],['pr','圧迫暗記','resumePr']]){const d=suspDesc(k);if(!d)continue;const t=new Date(SUSP[k].at||now());
    h+=`<div class="card susp"><div class="row"><div class="grow"><b>中断中の${lab}</b>　<b>${d.it.q}〔${d.it.no}〕</b> ${esc(d.it.title)}
     <div class="sub">${d.pos}${d.q}・${t.getMonth()+1}/${t.getDate()} ${pad(t.getHours())}:${pad(t.getMinutes())} に中断</div></div>
     <button class="b p" onclick="${fn}()">続きから再開</button><button class="b s" onclick="dropSusp('${k}')">破棄</button></div></div>`}
  return h}
function okNew(k){const d=suspDesc(k);if(!d)return true;
  return confirm(`中断中の${k==='run'?'練習':'圧迫暗記'}があります（${d.it.q}〔${d.it.no}〕 ${d.it.title}・${d.pos}）。\n新しく始めると、中断中の途中経過は消えます。よろしいですか？\n（キャンセルすると、各画面の「続きから再開」で戻れます）`)}
function dropSusp(k){if(!confirm('中断中の途中経過を破棄しますか？'))return;delete SUSP[k];sv(K_SUSP,SUSP);draw(1)}
function resumeRun(){const s=SUSP.run;if(!s||!BYID[s.id]){delete SUSP.run;sv(K_SUSP,SUSP);draw(1);return}
  pr=null;PT.on=false;rd=null;run={...s,edit:false};delete run.at;const n=blocksOf(run.id).length;if(run.i>n)run.i=n;
  TM.ms=run.tm||0;TM.on=false;draw()}
function resumePr(){const s=SUSP.pr;if(!s||!BYID[s.id]){delete SUSP.pr;sv(K_SUSP,SUSP);draw(1);return}
  run=null;TM.on=false;rd=null;PT.on=false;pr={...s};delete pr.at;const n=blocksOf(pr.id).length;if(pr.i>=n){pr.i=Math.min(pr.res.length,n-1);pr.ph='ready';pr.g=null}
  draw()}
function quitAsk(){const isP=!!pr,R=pr||run;if(!R)return;const it=BYID[R.id],n=blocksOf(R.id).length,done=(R.res||[]).length;
  const can=isP?prSnap():runSnap(),cur=isP&&(R.ph==='study'||R.ph==='test');
  document.getElementById('sheetIn').innerHTML=`<h2>${isP?'圧迫暗記':'練習'}を中断</h2><div style="margin-bottom:8px">${itemLabel(it)}</div>
   <p>${can?`区切り ${done} / ${n} まで終わっています。<b>保存して中断</b>すると、あとで「続きから再開」でこの続きから始められます（マップ・今日の暗記・読む・圧迫暗記の各画面に表示されます）。${cur?'<br><span class="sub">いま表示中・入力中の区切りは、再開したときに覚えるところからやり直します。</span>':''}${!isP&&(R.draft||'').trim()&&!R.graded?'<br><span class="sub">書きかけの解答と経過時間も保存します。</span>':''}`:'まだ保存する途中経過はありません。'}</p>
   <div class="row"><button class="b p" onclick="quitSave()">${can?'保存して中断':'やめる'}</button>${can?`<button class="b danger" onclick="quitDiscard()">記録せずにやめる</button>`:''}<button class="b" onclick="closeSheet()">続ける</button></div>`;
  document.getElementById('sheet').classList.add('on')}
function quitSave(){document.getElementById('sheet').classList.remove('on');go(pr?'press':tab)}
function quitDiscard(){if(!confirm('この途中経過を破棄します。よろしいですか？'))return;document.getElementById('sheet').classList.remove('on');
  const back=pr?'press':tab;if(pr)delete SUSP.pr;if(run)delete SUSP.run;sv(K_SUSP,SUSP);run=null;TM.on=false;TM.ms=0;pr=null;PT.on=false;rd=null;tab=back;draw()}

/* =========================================================
   読む（条文＋テキストの解説）
   条文（理論データ。テキスト修正があれば修正後）を見出しつきで表示し、
   セクションごとに、テキストの「要旨」（図）と「内容解説」を載せる。
   解説データは 解説データ.json（PDFから抽出：文章はテキスト、要旨・図解・まとめは画像）
   ========================================================= */
function openRead(q,focus){if(!QS.find(x=>x.q===q))return;leaveSession();closeSheetQuiet();tab='read';rd={q,jump:focus||null};C.lastRead={q,id:focus||''};saveConf();draw()}
function closeSheetQuiet(){document.getElementById('sheet').classList.remove('on')}
function notesOf(q){return NOTES&&NOTES.notes&&NOTES.notes[q]||null}
/* 解説をセクション（〔n〕）ごとに振り分ける。どのセクションにも当たらないもの（概要など）は general */
function notesMap(q){const N=notesOf(q);if(!N)return null;const nos=new Set(QS.find(x=>x.q===q).items.map(i=>+i.no)),m={general:{yoshi:[],items:[]}};
  const put=(k,x)=>{const s=(x.secs||[]).filter(n=>nos.has(n));if(!s.length)m.general[k].push(x);else s.forEach(n=>{(m[n]=m[n]||{yoshi:[],items:[]})[k].push(x)})};
  (N.yoshi||[]).forEach(y=>put('yoshi',y));(N.items||[]).forEach(i=>put('items',i));return m}
/* 条文の行を、テキストのように字下げして表示する（①…は1段、イ・ロ…は2段、その下の文は一段深く） */
function lawHTML(t,cls,off=0){let lv=0,pos=off;return t.split('\n').map(line=>{let L=null;const o=pos;pos+=line.length+1;const inner=spanHTML(line,cls,o);
    if(/^[⑴-⒇]/.test(line))L=0;else if(/^[①-⑳]/.test(line))L=1;else if(/^[イロハニホヘトチリヌ](?=[\s　]|[一-龥（])/.test(line))L=2;else if(/^（[0-9０-９]+）|^\([0-9]+\)/.test(line))L=3;
    if(L!=null){lv=L;return `<div style="margin-left:${Math.max(0,L-1)*1.2}em">${inner}</div>`}
    return `<div style="margin-left:${lv*1.2}em;text-indent:1em">${inner}</div>`}).join('')}
const imgHTML=p=>`<img src="${p.img}" width="${p.w}" height="${p.h}" loading="lazy" alt="図">`;
function noteBody(m){let h='';
  if(m.yoshi.length)h+=`<div class="lab">要旨</div>`+m.yoshi.map(y=>y.parts.map(imgHTML).join('')).join('');
  for(const it of m.items){h+=`<h4>${it.no?it.no+'．':''}${esc(it.head||'内容解説')} <span class="sub" style="font-weight:400">p.${it.page||''}</span></h4>`;
    h+=it.parts.map(p=>p.type==='img'?imgHTML(p):p.type==='label'?`<div class="lab">${esc(p.text)}</div>`:`<p class="${/^[⑴-⒇①-⑳・※（「〔イロハニホヘ]/.test(p.text)?'ni':''}">${esc(p.text)}</p>`).join('')}
  return h}
function noteBox(m,title){if(!m||(!m.yoshi.length&&!m.items.length))return '';
  return `<details class="note" ${C.readNotes!==false?'open':''}><summary>${title}（${[m.yoshi.length?'要旨':'',m.items.length?'内容解説 '+m.items.length+'件':''].filter(Boolean).join('・')}）</summary>${noteBody(m)}</details>`}
function vReadList(){const lr=C.lastRead&&QS.find(x=>x.q===C.lastRead.q);
  let h=vSuspCards()+`<div class="card"><h2>読む（条文と解説）</h2><p class="sub" style="margin-top:0">理論の条文を見出しつきで通して読めます。セクションごとに、テキストの「要旨」と「内容解説」も載せています。「本文を隠す」をオンにすると、見出しだけを見て思い出し、タップして答え合わせする読み方もできます。</p>
   <div class="row">${lr?`<button class="b p" onclick="openRead('${lr.q}','${C.lastRead.id||''}')">続きから読む（問題 ${lr.q} ${esc(lr.qt)}）</button>`:''}</div>
   ${!NOTES&&notesLoaded?`<p class="sub" style="margin-bottom:0">解説データが読み込まれていません。<b>解説データ.json</b> を読み込むと解説も表示されます（同期を設定済みなら、ほかの端末で読み込めば自動で届きます）。</p>
   <div class="row" style="margin-top:6px"><label class="b">解説データを読み込む<input type="file" accept=".json,application/json" style="display:none" onchange="importData(this.files[0])"></label></div>`:''}</div><div class="card">`;
  let lastCh='';
  for(const q of QS){const ch=q.q.split('-')[0];if(ch!==lastCh){if(lastCh)h+=`</div>`;lastCh=ch;h+=`<div class="ch">${ch}　${esc(q.ch)}</div><div class="grid">`}
    const N=notesOf(q.q),mx=Math.max(...q.items.map(i=>i.stars)),chars=q.items.reduce((s,i)=>s+charsOf(i.id),0);
    h+=`<div class="tile" onclick="openRead('${q.q}')"><div class="no">${q.q} ${stars(mx)}</div><div class="tt">${esc(q.qt)}</div>
      <div class="meta sub">${q.items.length}セクション・${chars}字${N&&N.pages&&N.pages.length?`<br>解説 p.${N.pages[0]}〜${N.pages[N.pages.length-1]}`:''}</div></div>`}
  return h+`</div></div>`}
function vRead(){const qi=QS.findIndex(x=>x.q===rd.q),q=QS[qi];if(!q){rd=null;return vReadList()}
  const prev=QS[qi-1],next=QS[qi+1],nm=notesMap(q.q),hide=!!C.readHide,ids=esc(JSON.stringify(q.items.map(i=>i.id)));
  let h=`<div class="card rnav"><div class="row"><button class="b s" onclick="rd=null;draw()">← 一覧</button><h2 class="grow" style="margin:0">問題 ${q.q}　${esc(q.qt)}</h2>
    <button class="b s" ${prev?`onclick="openRead('${prev.q}')"`:'disabled'}>‹ 前の問題</button><button class="b s" ${next?`onclick="openRead('${next.q}')"`:'disabled'}>次の問題 ›</button></div>
   <div class="row" style="margin-top:6px"><label class="sub"><input type="checkbox" ${C.readNotes!==false?'checked':''} onchange="C.readNotes=this.checked;saveConf();draw(1)"> 解説を開いて表示</label>
    <label class="sub"><input type="checkbox" ${hide?'checked':''} onchange="C.readHide=this.checked;saveConf();draw(1)"> 本文を隠す（タップで表示）</label>
    <label class="sub"><input type="checkbox" ${C.readErr!==false?'checked':''} onchange="C.readErr=this.checked;saveConf();draw(1)"> 間違えた所に色をつける</label>
    <span class="grow"></span><button class="b s p" onclick="startQueue(${ids})">この問題を練習</button><button class="b s" onclick="pQueue(${ids})">圧迫暗記</button></div></div>`;
  if(C.readErr!==false&&!hide&&q.items.some(i=>attemptsOf(i.id).length||pAtt(i.id).length))h+=`<div class="card" style="padding:8px 14px">${ERR_LEGEND}</div>`;
  if(!NOTES&&notesLoaded)h+=`<div class="card sub">解説データが未読み込みのため、条文だけを表示しています（「読む」の一覧画面か設定画面から <b>解説データ.json</b> を読み込めます）。</div>`;
  if(nm)h+=noteBox(nm.general,'この問題の解説（概要など）').replace('<details class="note"','<details class="note card"');
  for(const it of q.items){const B=blocksOf(it.id),st=itemStatus(it.id);
    h+=`<div class="card rsec" id="sec-${it.id}"><h2 style="margin:0 0 4px">〔${it.no}〕 ${esc(it.title)} ${stars(it.stars)}</h2><div class="row">
      <span class="sub grow">${st?`最新 <span class="${st.pass?'ok':'ng'}">${pct(st.acc)}</span>`:'未練習'}${pAtt(it.id).length?' '+ezTag(easeClass(it.id)):''}</span>
      ${hide?`<button class="b s" onclick="document.querySelectorAll('#sec-${it.id} .rtext').forEach(e=>e.classList.remove('hid'))">すべて表示</button>`:''}
      <button class="b s p" onclick="startQueue(['${it.id}'])">練習</button><button class="b s" onclick="pQueue(['${it.id}'])">圧迫</button></div>`;
    B.forEach((b,k)=>{const M=C.readErr!==false&&!hide?mistakesOf(it.id,k):null,raw=tgt(b),cls=M?errCls(raw,M):null,hl=headLabel(b),off=hl?hl.length+1:0;
      const hp=headParts(b.h),head=b.h?(cls&&hl?esc(hp.no)+(hp.no?' ':'')+spanHTML(hl,cls,0):esc(b.h)):'';
      const reps=M?M.clusters.filter(c=>c.status==='rep'):[];
      h+=`<div class="rblk"><div class="row" style="align-items:flex-start"><div class="rh grow">${head}</div><button class="b s" style="min-height:28px;padding:2px 8px;font-size:12px" onclick="editBlock('${it.id}',${k})">修正</button></div><div class="rtext${hide?' hid':''}" onclick="this.classList.remove('hid')">${lawHTML(b.t,cls,off)}</div>
       ${reps.map(c=>`<div class="erep"><span class="pill ng">${c.count}回</span> 正「${corWin(M,c)}」　誤「<span class="diff inl">${varHTML(M,c,c.vars[0].w)}</span>」</div>`).join('')}</div>`});
    if(nm)h+=noteBox(nm[+it.no],'解説');
    h+=`</div>`}
  h+=`<div class="row" style="justify-content:space-between">${prev?`<button class="b" onclick="openRead('${prev.q}')">‹ 問題 ${prev.q} ${esc(prev.qt)}</button>`:'<span></span>'}${next?`<button class="b p" onclick="openRead('${next.q}')">問題 ${next.q} ${esc(next.qt)} ›</button>`:''}</div>`;
  return h}

/* =========================================================
   間違いの記録（v2.4）
   採点のたびに、正解との文字比較から「どこを・どう間違えたか」を区切りごとに記録する。
   記録（attempt.blocks[k]）に追加する項目：
     e : [{p,n,m,w,b}]  p=正解（正規化後）の何文字目から, n=正解側の字数, m=正解側の文字（40字まで）,
                        w=自分が書いた文字（40字まで）, b=直前4文字（正解テキストが修正されたときの位置合わせ用）
     th: 正解テキスト（正規化後）のハッシュ, tl: その字数
   近い位置の間違い（間に一致が2文字以下）は1つにまとめる。30字以上ほとんど書けていない所は「脱落」として別扱い。
   集計：同じ区切りの過去の記録を位置で重ね、くり返し間違えている箇所（2回以上）を一覧にする。
   ========================================================= */
const GAP_N=30,E_MAX=40,CTX=6;
function hash32(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)}return (h>>>0).toString(36)}
function errsOf(ops,T){const segs=[];let ti=0,cur=null;
  for(const [t,c] of ops){if(t==='='){if(cur){segs.push(cur);cur=null}ti++;continue}
    if(!cur)cur={p:ti,m:'',w:''};if(t==='m'){cur.m+=c;ti++}else cur.w+=c}
  if(cur)segs.push(cur);
  const out=[];for(const s of segs){const L=out[out.length-1];
    if(L&&s.p-(L.p+L.m.length)<=2&&L.m.length<GAP_N&&s.m.length<GAP_N){const mid=T.slice(L.p+L.m.length,s.p);L.m+=mid+s.m;L.w+=mid+s.w}else out.push({...s})}
  return out.map(s=>({p:s.p,n:s.m.length,m:s.m.slice(0,E_MAX),w:s.w.slice(0,E_MAX),b:T.slice(Math.max(0,s.p-4),s.p)}))}
const isGapE=e=>e.n>=GAP_N&&(e.w||'').length<e.n/3;
/* 採点結果に間違いの記録を付ける（練習・圧迫暗記共通） */
function withErr(d,T){return {...d,T,th:hash32(T),err:errsOf(d.ops,T)}}
const errRec=g=>g&&g.err?{e:g.err,th:g.th,tl:(g.T||'').length}:{};

/* ---------- 集計 ---------- */
/* MCACHE（集計のキャッシュ）は先頭の ATT の隣で宣言 */
function resolveP(e,r,T,th){if(r.th===th)return e.p;const key=(e.b||'')+(e.m||'');if(!key)return null;
  const guess=r.tl?e.p*T.length/r.tl:e.p;let best=null,bd=1e9,i=T.indexOf(key);
  while(i>=0){const d=Math.abs(i+(e.b||'').length-guess);if(d<bd){bd=d;best=i+(e.b||'').length}i=T.indexOf(key,i+1)}return best}
function mistakesOf(id,k){const key=id+'#'+k;if(MCACHE[key]!==undefined)return MCACHE[key];
  const b=blocksOf(id)[k];if(!b)return MCACHE[key]=null;const T=norm(tgt(b)),th=hash32(T);
  const atts=[...attemptsOf(id).map(a=>({a,src:'練習'})),...pAtt(id).map(a=>({a,src:'圧迫'}))]
    .filter(x=>x.a.blocks&&x.a.blocks[k]&&Array.isArray(x.a.blocks[k].e)).sort((x,y)=>x.a.ts-y.a.ts);
  const heat=new Uint16Array(T.length),gap=new Uint16Array(T.length),occ=[];
  atts.forEach((x,ai)=>{const r=x.a.blocks[k];
    const ce=((r.ai&&r.ai.ce)||[]).map(c=>norm(c[0]||''));
    for(const e of r.e){const p=resolveP(e,r,T,th);if(p==null||p>T.length)continue;
      if(isGapE(e)){for(let i=p;i<Math.min(T.length,p+e.n);i++)gap[i]++;continue}
      const en=Math.min(T.length,p+Math.max(e.n,1));for(let i=p;i<en;i++)heat[i]++;
      occ.push({ai,s:p,e:Math.max(en,p+1),n:e.n,w:e.w||'',ts:x.a.ts,date:x.a.date,src:x.src,ce})}});
  occ.sort((a,b)=>a.s-b.s);const cl=[];
  for(const o of occ){const c=cl[cl.length-1];if(c&&o.s<=c.e+1){c.e=Math.max(c.e,o.e);c.occ.push(o)}else cl.push({s:o.s,e:o.e,occ:[o]})}
  for(const c of cl){const set=new Set(c.occ.map(o=>o.ai));c.atts=[...set].sort((a,b)=>a-b);c.count=c.atts.length;
    c.lastTs=Math.max(...c.occ.map(o=>o.ts));c.lastDate=c.occ.find(o=>o.ts===c.lastTs).date;
    let st=0;for(let i=atts.length-1;i>=0&&!set.has(i);i--)st++;c.streak=st;   // 最近、続けて正しく書けた回数
    c.hist=atts.map((x,i)=>set.has(i)).slice(-8);
    c.ws=Math.max(0,c.s-CTX);c.we=Math.min(T.length,c.e+CTX);
    const core=T.slice(c.s,c.e);c.ai=c.occ.some(o=>o.ce.some(x=>x&&(x.includes(core)||core.includes(x))));
    // 書き方ごとにまとめる（その回の、この箇所の間違いをすべて当てはめた文）
    const byA={};for(const o of c.occ)(byA[o.ai]=byA[o.ai]||[]).push(o);
    const vm={};for(const ai in byA){const w=writtenWin(T,c.ws,c.we,byA[ai]);(vm[w]=vm[w]||{w,n:0,last:0}).n++;vm[w].last=Math.max(vm[w].last,byA[ai][0].ts)}
    c.vars=Object.values(vm).sort((a,b)=>b.n-a.n||b.last-a.last);
    c.status=c.count>=2?(c.streak>=2?'fixed':'rep'):'once'}
  return MCACHE[key]={T,th,atts,clusters:cl,heat,gap}}
function writtenWin(T,ws,we,list){let s=T.slice(ws,we);
  for(const o of list.slice().sort((a,b)=>b.s-a.s)){const a=o.s-ws;if(a<0||a>s.length)continue;s=s.slice(0,a)+o.w+s.slice(a+o.n)}return s}
const corWin=(M,c)=>esc(M.T.slice(c.ws,c.s))+`<mark>${esc(M.T.slice(c.s,c.e))}</mark>`+esc(M.T.slice(c.e,c.we));
const varHTML=(M,c,w)=>renderDiff(diff(M.T.slice(c.ws,c.we),w).ops);
const histDots=c=>`<span class="dots">${c.hist.map(x=>`<i class="${x?'x':'o'}"></i>`).join('')}</span>`;
function repCount(id){let n=0;const B=blocksOf(id);for(let k=0;k<B.length;k++){const M=mistakesOf(id,k);if(M)n+=M.clusters.filter(c=>c.status==='rep').length}return n}

/* ---------- 採点画面：前にも間違えた箇所 ---------- */
function recurHTML(id,k,g){if(!g||!g.err)return '';const M=mistakesOf(id,k);if(!M||M.th!==g.th||!M.clusters.length)return '';
  const cur=g.err.filter(e=>!isGapE(e)).map(e=>({s:e.p,e:e.p+Math.max(e.n,1),n:e.n,w:e.w}));
  const rep=[],ok=[];
  for(const c of M.clusters){const hits=cur.filter(x=>x.s<=c.e&&x.e>=c.s);if(hits.length)rep.push([c,hits]);else if(c.count>=2)ok.push(c)}
  if(!rep.length&&!ok.length)return '';
  let h=`<div class="ai recur"><h4>前の記録との比較</h4>`;
  if(rep.length)h+=`<b style="font-size:13px" class="ng">前にも間違えた箇所</b><ul>${rep.map(([c,hits])=>`<li><span class="pill ng">${c.count+1}回目</span> 正しくは「${corWin(M,c)}」<br>
     <span class="sub">今回：</span><span class="diff inl">${varHTML(M,c,writtenWin(M.T,c.ws,c.we,hits))}</span>
     ${c.vars[0]?`<br><span class="sub">前回まで多い書き方：</span><span class="diff inl">${varHTML(M,c,c.vars[0].w)}</span> <span class="sub">×${c.vars[0].n}</span>`:''}</li>`).join('')}</ul>`;
  if(ok.length)h+=`<b style="font-size:13px" class="ok">今回は正しく書けた（前にくり返し間違えていた箇所）</b><ul>${ok.slice(0,5).map(c=>`<li>「${corWin(M,c)}」 <span class="sub">これまで${c.count}回間違い</span></li>`).join('')}</ul>`;
  return h+`</div>`}

/* ---------- 正解テキストに色をつける（読む・正解を見る） ----------
   norm() と同じ処理を1文字ずつ行い、正規化後の各文字が元のテキストの何文字目かを対応づける */
function normMap(s){const rm=new Uint8Array(s.length);
  if(S.settings.ignoreMarks){const re=new RegExp(MARK_RE.source,'gm');let m;while((m=re.exec(s))){for(let i=m.index;i<m.index+m[0].length;i++)rm[i]=1;if(!m[0].length)re.lastIndex++}}
  let out='';const idx=[];
  for(let i=0;i<s.length;i++){if(rm[i])continue;let t=s[i].normalize('NFKC').replace(/\s+/g,'');if(S.settings.ignorePunct)t=t.replace(/[、。,.，．・「」『』]/g,'');
    for(const ch of t){out+=ch;idx.push(i)}}
  return out===norm(s)?idx:null}
/* 元テキスト s の各文字のクラス（e1〜e3＝言い回しの間違いの回数、eg＝書けなかった所）。対応がとれなければ null */
function errCls(s,M){if(!M||(!M.clusters.length&&!M.gap.some(x=>x)))return null;const idx=normMap(s);if(!idx||idx.length!==M.T.length)return null;
  const cls=new Array(s.length).fill('');
  for(let j=0;j<idx.length;j++){const h=M.heat[j];const c=h>=3?'e3':h===2?'e2':h===1?'e1':M.gap[j]?'eg':'';if(c&&!cls[idx[j]])cls[idx[j]]=c}
  // 記号などで途切れた所を前後と同じ色でつなぐ
  for(let i=1;i<s.length-1;i++)if(!cls[i]&&cls[i-1]&&cls[i-1]===cls[i+1]&&!/\n/.test(s[i]))cls[i]=cls[i-1];
  return cls}
function spanHTML(s,cls,off=0){if(!cls)return esc(s);let h='',cur='',buf='';
  const fl=()=>{if(buf)h+=cur?`<span class="${cur}">${esc(buf)}</span>`:esc(buf);buf=''};
  for(let i=0;i<s.length;i++){const c=cls[off+i]||'';if(c!==cur){fl();cur=c}buf+=s[i]}fl();return h}
const ERR_LEGEND=`<span class="sub">色：<span class="e1">1回</span> <span class="e2">2回</span> <span class="e3">3回以上</span> 言い回しを間違えた所　<span class="eg">書けなかった所</span></span>`;

/* ---------- 間違いノート（タブ） ---------- */
function vErr(){const all=[];
  for(const it of ITEMS){if(!attemptsOf(it.id).length&&!pAtt(it.id).length)continue;const B=blocksOf(it.id);
    for(let k=0;k<B.length;k++){const M=mistakesOf(it.id,k);if(M)for(const c of M.clusters)all.push({it,k,M,c})}}
  const nRep=all.filter(x=>x.c.status==='rep').length,nFix=all.filter(x=>x.c.status==='fixed').length,nRec=new Set(all.map(x=>x.it.id)).size;
  const f=C.errF||'rep',sort=C.errSort||'count';
  let L=all.filter(x=>f==='all'?true:x.c.status===f);
  const ord=Object.fromEntries(ITEMS.map((i,n)=>[i.id,n]));
  L.sort(sort==='recent'?(a,b)=>b.c.lastTs-a.c.lastTs:sort==='order'?(a,b)=>ord[a.it.id]-ord[b.it.id]||a.k-b.k||a.c.s-b.c.s:(a,b)=>b.c.count-a.c.count||(b.c.streak===0)-(a.c.streak===0)||b.c.lastTs-a.c.lastTs);
  let h=`<div class="card"><h2>間違いノート</h2><p class="sub" style="margin-top:0">練習・圧迫暗記で採点するたびに、正解と比べて<b>どこを・どう書き間違えたか</b>を区切りごとに記録しています（v2.4以降の採点から）。
   同じ箇所を2回以上間違えたものを「くり返し中」、そのあと2回続けて正しく書けたものを「直ってきた」としています。「読む」画面でも、間違えた所に色がつきます。</p>
   <div class="stats"><div class="stat"><span class="sub">くり返し中</span><b class="ng">${nRep}</b></div><div class="stat"><span class="sub">直ってきた</span><b class="ok">${nFix}</b></div>
   <div class="stat"><span class="sub">記録のある理論</span><b>${nRec}</b></div><div class="stat"><span class="sub">間違えた箇所（1回を含む）</span><b>${all.length}</b></div></div>
   <div class="row" style="margin-top:10px"><div class="seg">${[['rep','くり返し中'],['fixed','直ってきた'],['once','1回だけ'],['all','すべて']].map(([k,l])=>`<button class="${f===k?'on':''}" onclick="C.errF='${k}';saveConf();draw(1)">${l}</button>`).join('')}</div>
   <div class="seg">${[['count','回数順'],['recent','新しい順'],['order','教科書順']].map(([k,l])=>`<button class="${sort===k?'on':''}" onclick="C.errSort='${k}';saveConf();draw(1)">${l}</button>`).join('')}</div>
   <span class="grow"></span>${all.length?`<button class="b s" onclick="exportErrCSV()">CSVで書き出す</button>`:''}${L.length?`<button class="b s p" onclick="startQueue(${esc(JSON.stringify([...new Set(L.map(x=>x.it.id))].slice(0,20)))})">この一覧の理論を練習</button>`:''}</div></div>`;
  if(!all.length)return h+`<div class="card empty">まだ記録がありません。練習か圧迫暗記で採点すると、ここに間違えた箇所がたまっていきます。</div>`;
  if(!L.length)return h+`<div class="card empty">該当する箇所はありません。</div>`;
  h+=`<div class="card"><p class="sub" style="margin-top:0">正＝正しい文（<mark>色</mark>の所を間違えた）／誤＝あなたが書いた文（<span style="background:var(--miss);padding:0 3px">赤</span>＝書けなかった字、<span style="background:var(--extra);text-decoration:line-through;padding:0 3px">灰</span>＝余分に書いた字）。●は直近の記録（赤＝この箇所を間違えた、緑＝正しく書けた）</p>`;
  L.slice(0,150).forEach(({it,k,M,c},n)=>{const b=blocksOf(it.id)[k];
    h+=`<div class="erow"><div class="row"><div class="grow"><b>${it.q}〔${it.no}〕</b> ${esc(it.title)} <span class="sub">区切り${k+1}${b&&b.h?' '+esc(b.h):''}</span></div>
      <span class="pill ${c.status==='fixed'?'':c.count>=2?'ng':'w'}">${c.count}回</span>${histDots(c)}${c.ai?' <span class="pill ng">意味が変わる</span>':''}</div>
     <div class="ecor">正：${corWin(M,c)}</div>
     ${c.vars.slice(0,3).map(v=>`<div class="evar">誤：<span class="diff inl">${varHTML(M,c,v.w)}</span> <span class="sub">×${v.n}</span></div>`).join('')}
     <div class="row" style="margin-top:4px"><span class="sub grow">最後に間違えた日 ${c.lastDate.slice(5)}${c.streak?`・その後${c.streak}回続けて正しく書けた`:''}</span>
      <button class="b s" onclick="openRead('${it.q}','${it.id}')">読む</button><button class="b s" onclick="errKinki('${it.id}',${k},${c.s})">禁忌に登録</button><button class="b s p" onclick="startQueue(['${it.id}'])">練習</button></div></div>`});
  return h+`${L.length>150?`<p class="sub">ほか ${L.length-150} 件</p>`:''}</div>`}
function errKinki(id,k,s){const M=mistakesOf(id,k),c=M&&M.clusters.find(x=>x.s===s);if(!c)return;
  const cor=M.T.slice(Math.max(c.ws,c.s-3),Math.min(c.we,c.e+3)),wr=c.vars[0]?c.vars[0].w:'';
  const txt=prompt('この理論の禁忌事項として登録します（AI判定がこの誤りを必ずチェックします）',`「${cor}」を「${wr}」と書かない（くり返し間違えている）`);if(!txt)return;
  S.kinki[uid()]={scope:id,text:txt.trim(),u:now()};saveState();toast('禁忌事項に登録しました')}
function exportErrCSV(){const rows=[['日付','種類','問題','区分','理論','区切り','見出し','正しい文','書いた文','この箇所を間違えた回数','状態']];
  for(const it of ITEMS){const B=blocksOf(it.id);for(let k=0;k<B.length;k++){const M=mistakesOf(it.id,k);if(!M)continue;
    for(const c of M.clusters){const byA={};c.occ.forEach(o=>(byA[o.ai]=byA[o.ai]||[]).push(o));
      for(const ai in byA){const o=byA[ai][0];rows.push([o.date,o.src,it.q,it.no,it.title,k+1,B[k].h||'',M.T.slice(c.ws,c.we),writtenWin(M.T,c.ws,c.we,byA[ai]),c.count,{rep:'くり返し中',fixed:'直ってきた',once:'1回'}[c.status]])}}}}
  dl(`間違いの記録_${TODAY()}.csv`,'﻿'+rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n'),'text/csv')}

/* =========================================================
   正解テキストの修正（v2.5）
   採点画面・読む画面から、区切りごとの正解テキスト（見出し・本文）を直せる。
   修正は S.overrides に保存（同期対象）。採点画面で直した場合は、同じ解答・同じ所要時間のまま採点し直す。
   ========================================================= */
function editBlock(id,k){const it=BYID[id],b=blocksOf(id)[k];if(!it||!b)return;
  const orig=BYID[id].blocks[k],changed=orig&&(orig.h!==b.h||orig.t!==b.t);
  const grading=(run&&run.graded&&run.id===id&&run.i===k)||(pr&&pr.ph==='graded'&&pr.id===id&&pr.i===k);
  document.getElementById('sheetIn').innerHTML=`<div class="row"><h2 class="grow" style="margin:0">正解テキストを修正</h2><button class="b s" onclick="closeSheet()">閉じる</button></div>
   <div style="margin:6px 0">${itemLabel(it)}<span class="sub">区切り ${k+1} / ${blocksOf(id).length}</span></div>
   <p class="sub">PDFから取り込んだときの誤りなどを直せます。修正は他の端末にも同期されます。${grading?'<b>保存すると、いまの解答のまま採点し直します。</b>':''}</p>
   <div class="field"><label>見出し（例：⑴ 課税の対象。なければ空欄）</label><input type="text" id="ebh" value="${esc(b.h||'')}"></div>
   <div class="field"><label>本文</label><textarea id="ebt" style="min-height:240px">${esc(b.t)}</textarea></div>
   ${changed?`<details style="margin:6px 0"><summary>取り込んだときの元のテキスト</summary><div class="answer">${esc((orig.h?orig.h+'\n':'')+orig.t)}</div></details>`:''}
   <div class="row"><button class="b p" onclick="saveBlockEdit('${id}',${k})">保存${grading?'して採点し直す':''}</button><button class="b" onclick="closeSheet()">キャンセル</button>
   <span class="grow"></span>${changed?`<button class="b s" onclick="resetBlockEdit('${id}',${k})">元のテキストに戻す</button>`:''}</div>`;
  document.getElementById('sheet').classList.add('on');setTimeout(()=>{const t=document.getElementById('ebt');t&&t.focus({preventScroll:true})},50)}
function setBlock(id,k,nb){const B=structuredClone(blocksOf(id));B[k]=nb;
  const O=BYID[id].blocks,same=B.length===O.length&&B.every((b,i)=>(b.h||null)===(O[i].h||null)&&b.t===O[i].t);
  S.overrides[id]={blocks:same?null:B,u:now()};saveState()}
function saveBlockEdit(id,k){const h=document.getElementById('ebh').value.trim()||null,t=document.getElementById('ebt').value.replace(/\s+$/,'');
  if(!t.trim()){toast('本文が空です');return}setBlock(id,k,{h,t});afterBlockEdit(id,k);toast('正解テキストを保存しました')}
function resetBlockEdit(id,k){if(!confirm('この区切りを取り込んだときの元のテキストに戻しますか？'))return;setBlock(id,k,structuredClone(BYID[id].blocks[k]));afterBlockEdit(id,k)}
function afterBlockEdit(id,k){document.getElementById('sheet').classList.remove('on');
  if(run&&run.graded&&run.id===id&&run.i===k)regrade();else if(pr&&pr.ph==='graded'&&pr.id===id&&pr.i===k)regrade();else draw(1)}
/* 同じ解答・同じ所要時間のまま、修正後の正解で採点し直す */
function regrade(){
  if(run&&run.graded){const g=run.graded,b=blocksOf(run.id)[run.i],hl=headLabel(b),T=norm(tgt(b)),d=withErr(diff(T,norm(g.input)),T);
    run.graded={...g,...d,hd:hl&&g.hin!=null?diff(norm(hl),norm(g.hin)):null,ai:null,aiState:aiReady()?'pending':'off',manual:null,regraded:true};draw(1);if(run.graded.aiState==='pending')runAI();else focusNext();return}
  if(pr&&pr.ph==='graded'){const g=pr.g,b=blocksOf(pr.id)[pr.i],hl=headLabel(b),T=norm(tgt(b)),d=withErr(diff(T,norm(g.input)),T);
    const hd=hl?diff(norm(hl),norm(g.hin||'')):null,st=!C.pressAI?'poff':aiReady()?'pending':'off';
    pr.g={...g,...d,hd,ai:null,aiState:st,manual:null,regraded:true};draw(1);if(st==='pending')runAI();else focusNext()}}

/* ---------- 起動 ---------- */
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
draw();
IDB.get('notes').then(n=>{NOTES=n||null}).catch(()=>{}).finally(()=>{notesLoaded=true;if(!run&&!pr&&(tab==='read'||tab==='set'))draw(1);syncNow(false)});
</script>
</body>
